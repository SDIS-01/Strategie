<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilotage SDACR</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --ink:#1d2433; --muted:#5b6475; --paper:#f6f7f9; --card:#ffffff; --line:#d9dde4;
  --accent:#1f3a5f; --accent-soft:#e6ecf4;
  --p1:#c8102e; --p1-soft:#fbe8eb; --p2:#c77700; --p2-soft:#fdf1e0; --p3:#4a6a8a; --p3-soft:#e9eff5;
  --ok:#2e7d4f; --warn:#c77700; --ko:#b3261e; --none:#aab1bd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Marianne,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:13px;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête : onglets + filtres */
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px 0}
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:3px 10px;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"].P1{background:var(--p1);border-color:var(--p1);color:#fff}
.chip[aria-pressed="true"].P2{background:var(--p2);border-color:var(--p2);color:#fff}
.chip[aria-pressed="true"].P3{background:var(--p3);border-color:var(--p3);color:#fff}
.filters select,.filters input{border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:#fff;max-width:220px}
.filters input{width:180px}
.reset{border:0;background:none;color:var(--accent);cursor:pointer;text-decoration:underline}
.count{margin-left:auto;color:var(--muted)}

main{flex:1;overflow:auto;padding:12px}
.view{display:none}.view.active{display:block}

/* Pilotage */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 12px}
.kpi b{display:block;font-size:22px;line-height:1.1}
.kpi span{color:var(--muted)}
.kpi.alert{border-left-color:var(--ko)}
.bar{display:flex;height:8px;margin-top:6px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line)}
.panel h2{font-size:14px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.obj{padding:9px 12px;background:var(--accent);color:#fff;font-weight:700}
.sobj{padding:7px 12px;background:var(--accent-soft);font-weight:600;color:var(--accent)}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;padding:8px 12px;border-top:1px solid var(--line);align-items:start}
.row:hover{background:#fafbfc}
.row .title{cursor:pointer}
.row .title strong{margin-right:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;color:var(--muted)}
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-weight:700;font-size:11px}
.badge.P1{background:var(--p1-soft);color:var(--p1)}
.badge.P2{background:var(--p2-soft);color:var(--p2)}
.badge.P3{background:var(--p3-soft);color:var(--p3)}
.badge.nd{background:#eee;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:3px;padding:0 6px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:4px}
.dot.complet{background:var(--ok)}.dot.partiel{background:var(--warn)}.dot.vide{background:var(--none)}
.links-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 9px;cursor:pointer;white-space:nowrap}
.links-btn.zero{color:var(--ko);border-color:#e7b9b5;background:#fdf3f2}
.links{grid-column:2 / 4;margin:4px 0 0;padding:6px 10px;background:var(--paper);border-left:3px solid var(--accent);list-style:none}
.links li{padding:2px 0}
.links .kind{color:var(--muted);font-size:11px;margin-left:6px}
table.grp{width:100%;border-collapse:collapse}
table.grp th,table.grp td{padding:6px 8px;border-top:1px solid var(--line);text-align:right}
table.grp th:first-child,table.grp td:first-child{text-align:left}
table.grp thead th{border-top:0;color:var(--muted);font-weight:600}

/* Matrice */
.matrix{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px}
.mhead{font-weight:700;text-align:center;padding:6px;color:var(--accent)}
.mrow{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
.mrow.P1{background:var(--p1)}.mrow.P2{background:var(--p2)}.mrow.P3{background:var(--p3)}
.cell{background:var(--card);border:1px solid var(--line);min-height:120px;padding:8px}
.cell header{all:unset;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cell header strong{font-size:13px}
.cell header em{font-style:normal;font-size:20px;font-weight:800;color:var(--muted)}
.cell.P1.oui{background:#fff7f8;border-color:var(--p1)}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:5px 7px;margin-top:4px;cursor:pointer;border-radius:3px}
.card:hover{border-color:var(--accent)}
.card small{color:var(--muted);display:block}
.unq{margin-top:12px}

/* Saisie */
.edit{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.edit{grid-template-columns:1fr}}
.list{max-height:calc(100vh - 170px);overflow:auto}
.item{display:grid;grid-template-columns:14px 1fr;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;padding:7px 10px;cursor:pointer}
.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.form{padding:14px}
.form h3{margin:0 0 4px;font-size:15px}
.form .ctx{color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600}
label input,label textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-weight:400;background:#fff}
label.full{grid-column:1 / 3}
textarea{min-height:80px;resize:vertical}
.invalid{border-color:var(--ko)!important;background:#fdf3f2!important}
.msgs{margin:12px 0 0;padding:0;list-style:none}
.msgs li{padding:4px 8px;margin-top:4px;border-radius:3px}
.msgs .err{background:#fdf3f2;color:var(--ko)}
.msgs .wrn{background:#fdf6ea;color:#8a5300}
.actions{display:flex;gap:10px;align-items:center;margin-top:14px}
.btn{border:0;background:var(--accent);color:#fff;padding:7px 16px;border-radius:4px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.status{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.error-box{margin:12px;padding:12px;background:#fdf3f2;border:1px solid #e7b9b5;color:var(--ko)}
</style>
</head>
<body>
<header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="pilotage" aria-selected="true">Pilotage</button>
    <button class="tab" role="tab" data-view="matrice" aria-selected="false">Matrice priorité × facilité</button>
    <button class="tab" role="tab" data-view="saisie" aria-selected="false">Saisie des indicateurs</button>
  </nav>
  <div class="filters">
    <button class="chip P1" data-prio="P1" aria-pressed="false">P1</button>
    <button class="chip P2" data-prio="P2" aria-pressed="false">P2</button>
    <button class="chip P3" data-prio="P3" aria-pressed="false">P3</button>
    <select id="fGrp" aria-label="Groupement pilote"></select>
    <select id="fObj" aria-label="Orientation"></select>
    <select id="fFac" aria-label="Facile à atteindre">
      <option value="">Facilité : toutes</option><option value="Oui">Facile : oui</option><option value="Non">Facile : non</option>
    </select>
    <input id="fTxt" type="search" placeholder="Rechercher…" aria-label="Rechercher">
    <button class="reset" id="reset">Réinitialiser</button>
    <span class="count" id="count"></span>
  </div>
</header>

<main>
  <div id="error"></div>
  <section class="view active" id="v-pilotage"></section>
  <section class="view" id="v-matrice"></section>
  <section class="view" id="v-saisie"></section>
</main>

<script>
/* =========================================================
   CONFIGURATION — noms de colonnes acceptés (accents, espaces
   et casse ignorés). Ajuster ici si un nom diffère.
   ========================================================= */
const CONFIG = {
  tableDefaut: 'Recap_SDACR',
  cols: {
    objectif:     ['ID_Objectif'],
    sousObjectif: ['ID_Sous_Objectif', 'ID_Sous Objectif'],
    resultat:     ['Resultat_Attendu'],
    priorite:     ['Priorite'],
    facile:       ['Facile_a_atteindre', 'Facile à atteindre'],
    groupement:   ['Groupement_Porteur', 'Groupement_Pilote'],
    t0:           ['Valeur_T0'],
    anneeT0:      ['Annee_T0'],
    cible:        ['Cible'],
    echeance:     ['Echeance'],
    observation:  ['Observation'],
    liens:        ['ID_Projet_Action']
  },
  // Table des projets/actions (utilisée si la colonne liens ne précise pas la table)
  tableProjets: 'Liste_PEPS_AV',
  colLibelleProjet: ['ID_Projet_Action', 'ID_Projet_Action_AV', 'Libelle', 'Intitule', 'Nom'],
  colTypeProjet: ['Nature', 'Type', 'Nature_Action', 'Type_Projet_Action']
};

const MATRICE = {
  'P1|Oui': 'Gains rapides',   'P1|Non': 'Chantiers stratégiques',
  'P2|Oui': 'À engager',       'P2|Non': 'À planifier',
  'P3|Oui': 'Opportunités',    'P3|Non': 'À différer'
};
const PRIO_COLOR = {P1:'var(--p1)', P2:'var(--p2)', P3:'var(--p3)'};

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const isEmpty = v => v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v));
const fmt = v => isEmpty(v) ? '—' : (typeof v === 'number' ? v.toLocaleString('fr-FR') : String(v));
const codeOf = s => (String(s || '').match(/^\s*([\d.]+)/) || [,''])[1].replace(/\.$/, '');
function natCmp(a, b){
  const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++){
    const x = pa[i] ?? -1, y = pb[i] ?? -1;
    if (x !== y) return (isNaN(x) ? 1e9 : x) - (isNaN(y) ? 1e9 : y);
  }
  return 0;
}
function resolveCol(keys, candidates){
  const map = {}; keys.forEach(k => map[norm(k)] = k);
  for (const c of candidates){ if (map[norm(c)]) return map[norm(c)]; }
  return null;
}
const normPrio = v => { const m = String(v || '').toUpperCase().match(/P\s*([123])/); return m ? 'P' + m[1] : ''; };
const normFac = v => {
  if (v === true) return 'Oui'; if (v === false) return 'Non';
  const s = norm(v || ''); return s.startsWith('oui') ? 'Oui' : s.startsWith('non') ? 'Non' : '';
};

/* ---------- état ---------- */
const S = {
  tableId: null, colIds: {}, rows: [], refLabels: {},
  view: 'pilotage', prios: new Set(), grp: '', obj: '', fac: '', txt: '',
  selectedId: null, openLinks: new Set(), dirty: false
};

/* ---------- lecture des liens projets/actions ---------- */
// Gère les encodages Grist : ['L', …], ['R', table, id], ['r', table, [ids]], ids bruts, textes
function collectRefs(v, out){
  if (v === null || v === undefined || v === '') return;
  if (Array.isArray(v)){
    if (v[0] === 'L'){ v.slice(1).forEach(x => collectRefs(x, out)); return; }
    if (v[0] === 'R'){ if (v[2]) out.push({t: v[1], id: v[2]}); return; }
    if (v[0] === 'r'){ (v[2] || []).forEach(id => id && out.push({t: v[1], id})); return; }
    v.forEach(x => collectRefs(x, out)); return;
  }
  if (typeof v === 'number'){ if (v > 0) out.push({t: null, id: v}); return; }
  if (typeof v === 'string'){
    const s = v.trim(); if (!s) return;
    if (s.startsWith('[')){ try { collectRefs(JSON.parse(s), out); return; } catch(e){} }
    s.split(/\n|;/).map(x => x.trim()).filter(Boolean).forEach(x => out.push({label: x}));
  }
}
function kindOf(label, typeVal){
  if (!isEmpty(typeVal)){
    const t = norm(typeVal);
    if (t.includes('projet') || t === 'p') return 'Projet';
    if (t.includes('action') || t === 'a' || t === 'av' || t === 'meo') return 'Action';
    return String(typeVal);
  }
  const m = String(label).match(/^\S*?_([A-Za-z]+)(\s|$)/);
  if (m){ const c = m[1].toUpperCase(); if (c === 'P') return 'Projet'; if (['A','AV','MEO'].includes(c)) return 'Action'; }
  return 'Non typé';
}
async function loadRefTables(tables){
  for (const t of tables){
    if (S.refLabels[t]) continue;
    try {
      const raw = await grist.docApi.fetchTable(t);
      const keys = Object.keys(raw).filter(k => k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper'));
      let lab = resolveCol(keys, CONFIG.colLibelleProjet);
      if (!lab) lab = keys.find(k => raw[k].some(x => typeof x === 'string' && x.trim())) || null;
      const typ = resolveCol(keys, CONFIG.colTypeProjet);
      const m = {};
      raw.id.forEach((id, i) => {
        const label = lab ? String(raw[lab][i] ?? '') : ('#' + id);
        m[id] = {label: label || ('#' + id), kind: kindOf(label, typ ? raw[typ][i] : null)};
      });
      S.refLabels[t] = m;
    } catch(e){ S.refLabels[t] = {}; }
  }
}

/* ---------- chargement ---------- */
async function load(){
  try {
    if (!S.tableId){
      try { S.tableId = await grist.getSelectedTableId(); } catch(e){}
      S.tableId = S.tableId || CONFIG.tableDefaut;
    }
    const raw = await grist.docApi.fetchTable(S.tableId);
    const keys = Object.keys(raw);
    const missing = [];
    for (const [k, cands] of Object.entries(CONFIG.cols)){
      S.colIds[k] = resolveCol(keys, cands);
      if (!S.colIds[k]) missing.push(cands[0]);
    }
    const errBox = $('#error');
    errBox.innerHTML = missing.length
      ? `<div class="error-box">Colonnes introuvables dans la table ${esc(S.tableId)} : ${missing.map(esc).join(', ')}. Ajustez CONFIG.cols en tête du widget.</div>` : '';

    const get = (k, i) => S.colIds[k] ? raw[S.colIds[k]][i] : null;
    const refTables = new Set();
    const rows = raw.id.map((id, i) => {
      const refs = []; collectRefs(get('liens', i), refs);
      refs.forEach(r => { if (r.id) refTables.add(r.t || CONFIG.tableProjets); });
      const resultat = String(get('resultat', i) ?? '');
      return {
        id, refs,
        objectif: String(get('objectif', i) ?? '') || 'Sans orientation',
        sousObjectif: String(get('sousObjectif', i) ?? '') || 'Sans sous-objectif',
        resultat, code: codeOf(resultat),
        priorite: normPrio(get('priorite', i)),
        facile: normFac(get('facile', i)),
        groupement: String(get('groupement', i) ?? '').trim(),
        t0: get('t0', i), anneeT0: get('anneeT0', i), cible: get('cible', i),
        echeance: get('echeance', i), observation: get('observation', i)
      };
    });
    await loadRefTables([...refTables]);
    rows.forEach(r => {
      const seen = new Set();
      r.links = [];
      r.refs.forEach(ref => {
        let item;
        if (ref.label) item = {label: ref.label, kind: kindOf(ref.label)};
        else {
          const t = ref.t || CONFIG.tableProjets;
          item = (S.refLabels[t] || {})[ref.id] || {label: '#' + ref.id, kind: 'Non typé'};
        }
        if (!seen.has(item.label)){ seen.add(item.label); r.links.push(item); }
      });
      r.nbProjets = r.links.filter(l => l.kind === 'Projet').length;
      r.nbActions = r.links.filter(l => l.kind === 'Action').length;
      const filled = ['t0','anneeT0','cible','echeance'].filter(k => !isEmpty(r[k])).length;
      r.etat = filled === 4 ? 'complet' : filled === 0 ? 'vide' : 'partiel';
    });
    rows.sort((a, b) => natCmp(a.code || '999', b.code || '999') || a.resultat.localeCompare(b.resultat, 'fr'));
    S.rows = rows;
    if (!S.selectedId || !rows.some(r => r.id === S.selectedId)) S.selectedId = rows[0]?.id ?? null;
    fillFilterOptions();
    render();
  } catch(e){
    $('#error').innerHTML = `<div class="error-box">Lecture impossible : ${esc(e.message || e)}. Vérifiez que le widget a l'accès complet au document.</div>`;
  }
}

/* ---------- filtres ---------- */
function fillFilterOptions(){
  const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr', {numeric: true}));
  const setOpts = (sel, first, vals, cur) => {
    sel.innerHTML = `<option value="">${first}</option>` + vals.map(v => `<option ${v === cur ? 'selected' : ''} value="${esc(v)}">${esc(v)}</option>`).join('');
  };
  setOpts($('#fGrp'), 'Groupement : tous', uniq(S.rows.map(r => r.groupement)), S.grp);
  setOpts($('#fObj'), 'Orientation : toutes', uniq(S.rows.map(r => r.objectif)), S.obj);
}
function filtered(){
  const q = norm(S.txt);
  return S.rows.filter(r =>
    (!S.prios.size || S.prios.has(r.priorite)) &&
    (!S.grp || r.groupement === S.grp) &&
    (!S.obj || r.objectif === S.obj) &&
    (!S.fac || r.facile === S.fac) &&
    (!q || norm(r.resultat + ' ' + r.sousObjectif + ' ' + (r.observation || '') + ' ' + r.links.map(l => l.label).join(' ')).includes(q))
  );
}

/* ---------- rendu ---------- */
function render(){
  const rows = filtered();
  $('#count').textContent = `${rows.length} / ${S.rows.length} résultats attendus`;
  if (S.view === 'pilotage') renderPilotage(rows);
  if (S.view === 'matrice') renderMatrice(rows);
  if (S.view === 'saisie') renderSaisie(rows);
}

function prioBadge(p){ return p ? `<span class="badge ${p}">${p}</span>` : `<span class="badge nd">Sans priorité</span>`; }
function indicText(r){
  if (r.etat === 'vide') return 'Indicateur non renseigné';
  return `T0 ${fmt(r.t0)}${isEmpty(r.anneeT0) ? '' : ' (' + r.anneeT0 + ')'} → cible ${fmt(r.cible)}${isEmpty(r.echeance) ? '' : ' en ' + r.echeance}`;
}
function linksLabel(r){
  const n = r.links.length;
  if (!n) return 'Aucun projet ni action';
  const parts = [];
  if (r.nbProjets) parts.push(`${r.nbProjets} projet${r.nbProjets > 1 ? 's' : ''}`);
  if (r.nbActions) parts.push(`${r.nbActions} action${r.nbActions > 1 ? 's' : ''}`);
  const other = n - r.nbProjets - r.nbActions;
  if (other) parts.push(`${other} autre${other > 1 ? 's' : ''}`);
  return parts.join(', ');
}

function renderPilotage(rows){
  const el = $('#v-pilotage');
  if (!rows.length){ el.innerHTML = `<div class="empty">Aucun résultat attendu ne correspond aux filtres. Modifiez ou réinitialisez les filtres.</div>`; return; }
  const n = rows.length;
  const byP = {P1:0, P2:0, P3:0, '':0}; rows.forEach(r => byP[r.priorite]++);
  const complets = rows.filter(r => r.etat === 'complet').length;
  const sansLien = rows.filter(r => !r.links.length).length;
  const distinct = new Map(); rows.forEach(r => r.links.forEach(l => distinct.set(l.label, l.kind)));
  const dP = [...distinct.values()].filter(k => k === 'Projet').length;
  const dA = [...distinct.values()].filter(k => k === 'Action').length;
  const curYear = new Date().getFullYear();
  const echus = rows.filter(r => !isEmpty(r.echeance) && Number(r.echeance) <= curYear).length;

  const bar = ['P1','P2','P3'].map(p => byP[p] ? `<i style="width:${byP[p]/n*100}%;background:${PRIO_COLOR[p]}" title="${p} : ${byP[p]}"></i>` : '').join('')
            + (byP[''] ? `<i style="width:${byP['']/n*100}%;background:var(--none)" title="Sans priorité : ${byP['']}"></i>` : '');

  let html = `<div class="kpis">
    <div class="kpi"><b>${n}</b><span>résultats attendus</span><div class="bar">${bar}</div>
      <span>P1 ${byP.P1} · P2 ${byP.P2} · P3 ${byP.P3}${byP[''] ? ' · sans priorité ' + byP[''] : ''}</span></div>
    <div class="kpi"><b>${complets} / ${n}</b><span>indicateurs complets (T0, année, cible, échéance)</span></div>
    <div class="kpi"><b>${distinct.size}</b><span>projets et actions liés distincts<br>${dP} projet${dP > 1 ? 's' : ''}, ${dA} action${dA > 1 ? 's' : ''}</span></div>
    <div class="kpi ${sansLien ? 'alert' : ''}"><b>${sansLien}</b><span>résultats sans projet ni action</span></div>
    <div class="kpi"><b>${echus}</b><span>échéance en ${curYear} ou avant</span></div>
  </div><div class="two"><div class="panel">`;

  let lastO = null, lastS = null;
  rows.forEach(r => {
    if (r.objectif !== lastO){ html += `<div class="obj">${esc(r.objectif)}</div>`; lastO = r.objectif; lastS = null; }
    if (r.sousObjectif !== lastS){ html += `<div class="sobj">${esc(r.sousObjectif)}</div>`; lastS = r.sousObjectif; }
    const open = S.openLinks.has(r.id);
    html += `<div class="row">
      <span class="dot ${r.etat}" title="Indicateur ${r.etat}"></span>
      <div><div class="title" data-edit="${r.id}" title="Ouvrir la saisie">${esc(r.resultat)}</div>
        <div class="meta">${prioBadge(r.priorite)}
          ${r.facile ? `<span class="tag">Facile : ${r.facile.toLowerCase()}</span>` : ''}
          ${r.groupement ? `<span class="tag">${esc(r.groupement)}</span>` : ''}
          <span>${esc(indicText(r))}</span></div></div>
      <button class="links-btn ${r.links.length ? '' : 'zero'}" data-links="${r.id}" aria-expanded="${open}" ${r.links.length ? '' : 'disabled'}>${esc(linksLabel(r))}</button>
      ${open ? `<ul class="links">${r.links.map(l => `<li>${esc(l.label)}<span class="kind">${esc(l.kind)}</span></li>`).join('')}</ul>` : ''}
    </div>`;
  });
  html += `</div><div class="panel"><h2>Par groupement pilote</h2>${groupTable(rows)}</div></div>`;
  el.innerHTML = html;
}

function groupTable(rows){
  const g = {};
  rows.forEach(r => {
    const k = r.groupement || 'Non renseigné';
    g[k] = g[k] || {n:0, P1:0, P2:0, P3:0, liens:new Set(), sans:0};
    g[k].n++; if (r.priorite) g[k][r.priorite]++;
    r.links.forEach(l => g[k].liens.add(l.label)); if (!r.links.length) g[k].sans++;
  });
  const keys = Object.keys(g).sort((a, b) => g[b].n - g[a].n || a.localeCompare(b, 'fr'));
  return `<table class="grp"><thead><tr><th>Groupement</th><th>Résultats</th><th>P1</th><th>P2</th><th>P3</th><th>Proj./act.</th><th>Sans lien</th></tr></thead><tbody>
    ${keys.map(k => `<tr><td>${esc(k)}</td><td>${g[k].n}</td><td>${g[k].P1}</td><td>${g[k].P2}</td><td>${g[k].P3}</td><td>${g[k].liens.size}</td><td>${g[k].sans}</td></tr>`).join('')}
  </tbody></table>`;
}

function renderMatrice(rows){
  const el = $('#v-matrice');
  const cardHtml = r => `<button class="card" data-edit="${r.id}"><strong>${esc(r.code || '—')}</strong> ${esc(r.resultat.replace(/^\s*[\d.]+\s*/, '').slice(0, 90))}${r.resultat.length > 90 ? '…' : ''}
    <small>${esc(r.groupement || 'Groupement non renseigné')}, ${esc(linksLabel(r).toLowerCase())}</small></button>`;
  let html = `<div class="matrix"><div></div><div class="mhead">Facile à atteindre</div><div class="mhead">Difficile à atteindre</div>`;
  ['P1','P2','P3'].forEach(p => {
    html += `<div class="mrow ${p}">${p}</div>`;
    ['Oui','Non'].forEach(f => {
      const items = rows.filter(r => r.priorite === p && r.facile === f);
      html += `<div class="cell ${p} ${f.toLowerCase()}"><header><strong>${MATRICE[p + '|' + f]}</strong><em>${items.length}</em></header>${items.map(cardHtml).join('')}</div>`;
    });
  });
  html += `</div>`;
  const unq = rows.filter(r => !r.priorite || !r.facile);
  if (unq.length) html += `<div class="panel unq"><h2>À qualifier (priorité ou facilité manquante) : ${unq.length}</h2><div style="padding:8px">${unq.map(cardHtml).join('')}</div></div>`;
  el.innerHTML = html;
}

function renderSaisie(rows){
  const el = $('#v-saisie');
  if (!rows.length){ el.innerHTML = `<div class="empty">Aucun résultat attendu ne correspond aux filtres.</div>`; return; }
  if (!rows.some(r => r.id === S.selectedId)) S.selectedId = rows[0].id;
  const r = S.rows.find(x => x.id === S.selectedId);
  const v = x => isEmpty(x) ? '' : esc(x);
  el.innerHTML = `<div class="edit">
    <div class="panel list">${rows.map(x => `<button class="item" data-select="${x.id}" aria-current="${x.id === r.id}">
      <span class="dot ${x.etat}"></span><span>${esc(x.resultat.slice(0, 110))}${x.resultat.length > 110 ? '…' : ''}</span></button>`).join('')}</div>
    <div class="panel form">
      <h3>${esc(r.resultat)}</h3>
      <div class="ctx">${esc(r.objectif)} › ${esc(r.sousObjectif)}<br>${prioBadge(r.priorite)} ${r.facile ? 'Facile : ' + r.facile.toLowerCase() + ', ' : ''}${esc(r.groupement || 'groupement non renseigné')}, ${esc(linksLabel(r).toLowerCase())}</div>
      <div class="grid">
        <label>Valeur T0<input id="iT0" inputmode="decimal" value="${v(r.t0)}"></label>
        <label>Année T0<input id="iAn" inputmode="numeric" maxlength="4" value="${v(r.anneeT0)}"></label>
        <label>Cible<input id="iCi" inputmode="decimal" value="${v(r.cible)}"></label>
        <label>Échéance (année)<input id="iEc" inputmode="numeric" maxlength="4" value="${v(r.echeance)}"></label>
        <label class="full">Observation<textarea id="iOb">${v(r.observation)}</textarea></label>
      </div>
      <ul class="msgs" id="msgs"></ul>
      <div class="actions">
        <button class="btn" id="save" disabled>Enregistrer</button>
        <button class="btn ghost" id="cancel" disabled>Annuler les modifications</button>
        <span class="status" id="status"></span>
      </div>
    </div></div>`;
  S.dirty = false;
  ['iT0','iAn','iCi','iEc','iOb'].forEach(id => $('#' + id).addEventListener('input', () => { S.dirty = true; validate(); }));
  $('#save').addEventListener('click', save);
  $('#cancel').addEventListener('click', () => renderSaisie(filtered()));
  validate(); $('#save').disabled = true; $('#cancel').disabled = true;
}

/* ---------- saisie : contrôle et enregistrement ---------- */
function parseNum(s){ s = s.trim().replace(/\s/g, '').replace(',', '.'); if (!s) return null; const n = Number(s); return isNaN(n) ? NaN : n; }
function parseYear(s){ s = s.trim(); if (!s) return null; return /^\d{4}$/.test(s) && +s >= 1990 && +s <= 2100 ? +s : NaN; }
function validate(){
  const f = {t0: parseNum($('#iT0').value), an: parseYear($('#iAn').value), ci: parseNum($('#iCi').value), ec: parseYear($('#iEc').value)};
  const err = [], wrn = [];
  const mark = (id, bad) => $('#' + id).classList.toggle('invalid', bad);
  mark('iT0', Number.isNaN(f.t0)); if (Number.isNaN(f.t0)) err.push('Valeur T0 : saisissez un nombre.');
  mark('iCi', Number.isNaN(f.ci)); if (Number.isNaN(f.ci)) err.push('Cible : saisissez un nombre.');
  mark('iAn', Number.isNaN(f.an)); if (Number.isNaN(f.an)) err.push('Année T0 : saisissez une année sur 4 chiffres.');
  mark('iEc', Number.isNaN(f.ec)); if (Number.isNaN(f.ec)) err.push('Échéance : saisissez une année sur 4 chiffres.');
  if (typeof f.an === 'number' && typeof f.ec === 'number' && !isNaN(f.an) && !isNaN(f.ec) && f.ec <= f.an){
    err.push("L'échéance doit être postérieure à l'année T0."); mark('iEc', true);
  }
  if (f.t0 !== null && f.an === null) wrn.push("Valeur T0 saisie sans son année de référence.");
  if (f.t0 !== null && f.ci === null) wrn.push("Valeur T0 saisie sans cible.");
  if (f.ci !== null && f.ec === null) wrn.push("Cible saisie sans échéance.");
  if (f.t0 !== null && f.ci !== null && !isNaN(f.t0) && f.t0 === f.ci) wrn.push("La cible est égale à la valeur T0.");
  $('#msgs').innerHTML = err.map(m => `<li class="err">${esc(m)}</li>`).join('') + wrn.map(m => `<li class="wrn">${esc(m)}</li>`).join('');
  $('#save').disabled = !S.dirty || err.length > 0;
  $('#cancel').disabled = !S.dirty;
  return {ok: !err.length, f};
}
async function save(){
  const {ok, f} = validate(); if (!ok) return;
  const c = S.colIds, fields = {};
  if (c.t0) fields[c.t0] = f.t0;
  if (c.anneeT0) fields[c.anneeT0] = f.an;
  if (c.cible) fields[c.cible] = f.ci;
  if (c.echeance) fields[c.echeance] = f.ec;
  if (c.observation) fields[c.observation] = $('#iOb').value.trim() || null;
  $('#save').disabled = true; $('#status').textContent = 'Enregistrement…';
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', S.tableId, S.selectedId, fields]]);
    S.dirty = false;
    $('#status').textContent = 'Enregistré.';
  } catch(e){
    $('#status').textContent = 'Échec de l\'enregistrement : ' + (e.message || e);
    $('#save').disabled = false;
  }
}

/* ---------- navigation et interactions ---------- */
function confirmLeave(){ return !S.dirty || confirm('Des modifications ne sont pas enregistrées. Les abandonner ?'); }
function setView(v){
  if (S.view === 'saisie' && v !== 'saisie' && !confirmLeave()) return;
  S.view = v;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'v-' + v));
  S.dirty = false; render();
}
function selectRow(id, openEdit){
  if (S.view === 'saisie' && id !== S.selectedId && !confirmLeave()) return;
  S.selectedId = id; S.dirty = false;
  try { grist.setCursorPos({rowId: id}); } catch(e){}
  if (openEdit && S.view !== 'saisie') setView('saisie'); else render();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));
document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  const p = ch.dataset.prio; S.prios.has(p) ? S.prios.delete(p) : S.prios.add(p);
  ch.setAttribute('aria-pressed', S.prios.has(p)); render();
}));
$('#fGrp').addEventListener('change', e => { S.grp = e.target.value; render(); });
$('#fObj').addEventListener('change', e => { S.obj = e.target.value; render(); });
$('#fFac').addEventListener('change', e => { S.fac = e.target.value; render(); });
$('#fTxt').addEventListener('input', e => { S.txt = e.target.value; render(); });
$('#reset').addEventListener('click', () => {
  S.prios.clear(); S.grp = S.obj = S.fac = S.txt = '';
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  $('#fGrp').value = $('#fObj').value = $('#fFac').value = $('#fTxt').value = '';
  render();
});
document.querySelector('main').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed){ selectRow(+ed.dataset.edit, true); return; }
  const se = e.target.closest('[data-select]'); if (se){ selectRow(+se.dataset.select, false); return; }
  const lk = e.target.closest('[data-links]');
  if (lk){ const id = +lk.dataset.links; S.openLinks.has(id) ? S.openLinks.delete(id) : S.openLinks.add(id); render(); }
});

/* ---------- branchement Grist ---------- */
let timer = null;
const reload = () => { clearTimeout(timer); timer = setTimeout(() => { if (!S.dirty) load(); }, 250); };
grist.ready({requiredAccess: 'full'});
grist.onRecords(reload);
grist.onRecord(rec => {
  if (!rec || rec.id === S.selectedId || S.dirty) return;
  S.selectedId = rec.id; if (S.view === 'saisie') render();
});
</script>
</body>
</html>
