    <select id="pScope" aria-label="Stratégies prises en compte"><option value="">Toutes les stratégies</option>
      ${S.strategies.map(s => `<option value="${esc(s.id)}" ${s.id === S.pvScope ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}</select>
    ${natures.length ? `<select id="pNat" aria-label="Nature"><option value="">Nature : toutes</option>
      ${natures.map(n => `<option value="${esc(n)}" ${n === S.pvNat ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : ''}
    <input id="pTxt" type="search" placeholder="Rechercher un projet…" aria-label="Rechercher un projet" value="${esc(S.pvTxt)}">
    <button class="chip warn" id="pNoLink" aria-pressed="${S.pvNoLink}"></button>
    <span class="count" id="pCount"></span>`;
}

/* ---------- rattachement projet ↔ résultats attendus (écriture dans Liste_Action_MEO) ---------- */
const projRowId = p => p && p.key.startsWith(CONFIG.tableProjets + ':') ? +p.key.slice(CONFIG.tableProjets.length + 1) : null;
const lignesProj = p => { const id = projRowId(p); return id && S.pv.meo ? S.pv.meo.actions.filter(a => a.proj === id) : []; };
const meoOf = p => lignesProj(p).filter(a => a.ok);  // lignes PEPS/AV du projet, seules modifiables
const viaMeo = (p, sid, rid) => meoOf(p).filter(a => (a.links[sid] || []).includes(rid));
const viaAutre = (p, sid, rid) => lignesProj(p).filter(a => !a.ok && (a.links[sid] || []).includes(rid));
const natureOk = p => !S.pv.projets.natCol || CONFIG.naturesRattachables.some(n => norm(p.nature) === norm(n));
function rattachInfo(p){
  if (!projRowId(p)) return {ok: false, why: `Projet absent de ${CONFIG.tableProjets} : rattachement impossible depuis le widget.`};
  if (!natureOk(p)) return {ok: false, why: `Nature « ${p.nature || 'non renseignée'} » : seuls les projets ${CONFIG.naturesRattachables.join(' et ')} sont rattachés aux stratégies.`};
  if (!S.pv.meo) return {ok: false, why: `Table ${CONFIG.tableMEO} introuvable ou sans colonne de référence vers ${CONFIG.tableProjets} : rattachement impossible.`};
  if (!S.pv.meo.natCol) return {ok: false, why: `Colonne ${CONFIG.colNatureMEO[0]} introuvable dans ${S.pv.meo.table} : rattachement impossible.`};
  if (!Object.keys(S.pv.meo.stratCols).length) return {ok: false, why: `Aucune colonne de ${S.pv.meo.table} ne pointe vers une table de stratégie en saisie libre : rattachement impossible.`};
  if (!meoOf(p).length) return {ok: false, why: `Aucune ligne de nature ${CONFIG.naturesRattachables.join(' ou ')} pour ce projet dans ${S.pv.meo.table} : rattachement impossible.`};
  return {ok: true};
}
const pvChanges = () => S.pvEdit ? S.pvEdit.draft.size : 0;
const confirmPv = () => !pvChanges() || confirm('Des rattachements ne sont pas enregistrés. Les abandonner ?');
function pvCounts(){
  let a = 0, r = 0; if (S.pvEdit) S.pvEdit.draft.forEach(d => d.on ? a++ : r++);
  const t = []; if (a) t.push(`${a} rattachement${a > 1 ? 's' : ''}`); if (r) t.push(`${r} détachement${r > 1 ? 's' : ''}`);
  return t.length ? t.join(', ') : 'Aucune modification';
}
function panelRow(p, sid, r){
  const k = sid + '|' + r.id, d = S.pvEdit.draft.get(k), via = viaMeo(p, sid, r.id), on = d ? d.on : via.length > 0, acts = meoOf(p);
  const horsPA = !via.length && !d && viaAutre(p, sid, r.id).length > 0;  // lien porté par une ligne d'une autre nature : non modifiable
  let right = '<span></span>';
  if (d && d.on && acts.length > 1)
    right = `<select data-meo="${esc(k)}" aria-label="Ligne PEPS/AV portant le lien">${acts.map(a => `<option value="${a.id}" ${a.id === d.meo ? 'selected' : ''}>${esc(a.label)} (${esc(a.nature)})</option>`).join('')}</select>`;
  else if (d && d.on) right = '<span class="via">à rattacher</span>';
  else if (d) right = '<span class="via del">à détacher</span>';
  else if (horsPA) right = `<span class="via">lien porté par une ligne ${esc(viaAutre(p, sid, r.id)[0].nature || 'hors PEPS/AV')}, non modifiable ici</span>`;
  const id = 'ck-' + sid + '-' + r.id;
  return `<div class="ck ${d ? (d.on ? 'add' : 'rem') : ''}" data-row="${esc(k)}" data-q="${esc(norm(r.resultat + ' ' + r.objectif))}">
    <input type="checkbox" id="${esc(id)}" data-pk="${esc(k)}" ${on || horsPA ? 'checked' : ''} ${horsPA ? 'disabled' : ''}>
    <label for="${esc(id)}"><b>${esc(r.code || '—')}</b><span>${esc(r.resultat.replace(/^\s*[\d.]+\s*/, ''))}</span></label>${prioBadge(r.priorite)}${right}</div>`;
}
function panelHtml(p){
  const E = S.pvEdit, meo = S.pv.meo;
  const strats = S.strategies.filter(s => meo.stratCols[s.id] || meo.roStrat[s.id]);
  if (!strats.some(s => s.id === E.strat)) E.strat = (strats.find(s => meo.stratCols[s.id]) || strats[0]).id;
  const sid = E.strat, ro = !meo.stratCols[sid];
  const rows = S.pv.results.filter(r => r.strat.id === sid).sort((x, y) => natCmp(x.code || '999', y.code || '999'));
  let list = '';
  if (ro) list = `<div class="note">La colonne ${esc(meo.roStrat[sid])} de ${esc(meo.table)} est calculée par formule : rattachement impossible pour cette stratégie.</div>`;
  else for (const [obj, oRows] of groupBy(rows, r => r.objectif))
    list += `<div class="ckg"><div class="sobj"><span>${esc(obj)}</span><span></span></div>${oRows.map(r => panelRow(p, sid, r)).join('')}</div>`;
  return `<div class="edp">
    <div class="etools">
      ${strats.map(s => `<button class="chip" data-pvstrat="${esc(s.id)}" aria-pressed="${s.id === sid}">${esc(s.label)}</button>`).join('')}
      <input type="search" id="pvQ" placeholder="Rechercher un résultat…" aria-label="Rechercher un résultat" value="${esc(E.q)}">
    </div>
    <div class="elist">${list || '<div class="empty">Aucun résultat attendu dans cette stratégie.</div>'}</div>
    <div class="efoot">
      <span id="pvCount">${pvCounts()}</span>
      ${S.obsCols ? `<label>Auteur <input id="pvAuteur" value="${esc(S.auteur)}" placeholder="Nom Prénom" autocomplete="name"></label>` : '<span class="status">Table Observations absente : modifications non tracées.</span>'}
      <span class="sp"><button class="btn ghost" data-pvcancel>Annuler</button><button class="btn" data-pvsave>Enregistrer</button></span>
      <span class="status" id="pvStatus" role="status"></span>
    </div></div>`;
}
function pvFilter(){
  const q = norm(S.pvEdit ? S.pvEdit.q : '');
  document.querySelectorAll('.edp .ckg').forEach(g => {
    let n = 0; g.querySelectorAll('.ck').forEach(c => { const h = !!q && !c.dataset.q.includes(q); c.hidden = h; if (!h) n++; });
    g.hidden = !n;
  });
}
function pvToggle(k, on){
  const p = S.pv.projets.get(S.pvEdit.key), [sid, rid] = k.split('|'), cur = viaMeo(p, sid, +rid).length > 0;
  if (on === cur) S.pvEdit.draft.delete(k); else S.pvEdit.draft.set(k, {on, meo: on ? meoOf(p)[0].id : null});
  S.dirty = pvChanges() > 0;
  const r = S.pv.results.find(x => x.strat.id === sid && x.id === +rid), row = document.querySelector(`.ck[data-row="${CSS.escape(k)}"]`);
  if (row){ row.outerHTML = panelRow(p, sid, r); }
  $('#pvCount').textContent = pvCounts(); $('#pvStatus').textContent = '';
}
async function pvSave(auteurForce){
  const E = S.pvEdit, meo = S.pv.meo, p = S.pv.projets.get(E.key);
  if (!E.draft.size){ $('#pvStatus') && ($('#pvStatus').textContent = 'Aucune modification à enregistrer.'); return false; }
  const auteur = (auteurForce ?? ($('#pvAuteur') ? $('#pvAuteur').value : '')).trim();
  if (S.obsCols && !auteur){
    if ($('#pvAuteur')){ $('#pvAuteur').classList.add('invalid'); $('#pvAuteur').focus(); $('#pvStatus').textContent = 'Saisissez votre nom pour la traçabilité.'; }
    return false;
  }
  if (auteur) S.auteur = auteur;
  const fin = new Map(), obs = [];
  const setOf = (a, sid) => { const col = meo.stratCols[sid], k = a.id + '|' + col;
    if (!fin.has(k)) fin.set(k, {a, col, ids: new Set(a.links[sid] || [])}); return fin.get(k).ids; };
  for (const [k, d] of E.draft){
    const [sid, rs] = k.split('|'), rid = +rs, r = S.pv.results.find(x => x.strat.id === sid && x.id === rid);
    if (!meo.stratCols[sid]) continue;
    if (d.on){
      const a = meoOf(p).find(x => x.id === d.meo) || meoOf(p)[0]; setOf(a, sid).add(rid);
      obs.push([sid, r, `Projet « ${p.label} » rattaché à ce résultat (widget de pilotage).`]);
    } else {
      const via = viaMeo(p, sid, rid); via.forEach(a => setOf(a, sid).delete(rid));
      obs.push([sid, r, `Projet « ${p.label} » détaché de ce résultat (widget de pilotage).`]);
    }
  }
  const actions = [...fin.values()].map(f => ['UpdateRecord', meo.table, f.a.id, {[f.col]: ['L', ...[...f.ids].sort((x, y) => x - y)]}]);
  if (S.obsCols) obs.forEach(([sid, r, txt]) => {
    const c = S.obsCols, rec = {}; rec[c.strategie] = sid; rec[c.idResultat] = r.id; rec[c.texte] = txt; rec[c.nom] = auteur;
    if (c.date) rec[c.date] = Date.now() / 1000; if (c.resultat) rec[c.resultat] = r.resultat;
    actions.push(['AddRecord', CONFIG.tableObs, null, rec]);
  });
  const msg = pvCounts();
  if ($('#pvStatus')) $('#pvStatus').textContent = 'Enregistrement…';
  try {
    await grist.docApi.applyUserActions(actions);
  } catch(e){
    const t = "Échec de l'enregistrement : " + (e.message || e);
    if ($('#pvStatus')) $('#pvStatus').textContent = t; else alert(t);
    return false;
  }
  S.pvEdit = null; S.dirty = false; S.pvMsg = msg + ' enregistré' + (obs.length > 1 ? 's' : '') + (S.obsCols ? ', tracé dans Observations.' : '.');
  await load();
  return true;
}
async function pvDetach(sid, rid){
  const p = S.pv.projets.get(S.pvSel), r = S.pv.results.find(x => x.strat.id === sid && x.id === rid);
  if (!confirm(`Détacher le résultat ${r.code || ''} du projet « ${p.label} » ?`)) return;
  let auteur = S.auteur;
  if (S.obsCols && !auteur){ auteur = (prompt('Votre nom, pour la traçabilité dans Observations :') || '').trim(); if (!auteur) return; }
  S.pvEdit = {key: p.key, strat: sid, q: '', draft: new Map([[sid + '|' + rid, {on: false}]])};
  if (!await pvSave(auteur)){ S.pvEdit = null; renderProjets(); }
}

function renderProjets(){
  const body = $('#pBody');
  if (!S.pv){
    body.innerHTML = '<div class="empty">Chargement des projets et des liens de toutes les stratégies…</div>';
    ensurePv().then(() => { buildProjTools(); if (S.view === 'projets') renderProjets(); })
      .catch(e => { body.innerHTML = `<div class="banner">Lecture impossible : ${esc(e.message || e)}.</div>`; });
    return;
  }
  if (!$('#pScope')) buildProjTools();
  const q = norm(S.pvTxt);
  const all = [...S.pv.projets.values()].filter(p => !p.libre || p.results.length).map(p => ({p, res: p.results.filter(inScope)}));
  const base = all.filter(x => (!S.pvNat || x.p.nature === S.pvNat) && (!q || norm(x.p.label + ' ' + x.p.groupement).includes(q)));
  const sansLien = base.filter(x => !x.res.length && !x.p.libre && natureOk(x.p));
  const list = (S.pvNoLink ? sansLien : base)
    .sort((a, b) => (!a.res.length) - (!b.res.length) || a.p.label.localeCompare(b.p.label, 'fr', {numeric: true}));
  $('#pNoLink').textContent = `Sans lien stratégique (${sansLien.length})`;
  $('#pNoLink').setAttribute('aria-pressed', S.pvNoLink);
  $('#pCount').textContent = `${list.length} projet${list.length > 1 ? 's' : ''}/action${list.length > 1 ? 's' : ''}`;
  const warn = S.pv.errors.length ? `<div class="banner info">Tables non lues : ${S.pv.errors.map(esc).join(', ')}.</div>` : '';
  if (!list.length){ body.innerHTML = warn + '<div class="empty">Aucun projet ou action ne correspond. Modifiez la recherche ou les filtres.</div>'; return; }
  if (!list.some(x => x.p.key === S.pvSel)) S.pvSel = list[0].p.key;

  const nStrat = res => new Set(res.map(r => r.strat.id)).size;
  const item = ({p, res}) => `<button class="pitem ${res.length || p.libre || !natureOk(p) ? '' : 'nolink'}" data-proj="${esc(p.key)}" aria-current="${p.key === S.pvSel}">
      ${esc(p.label)}<small>${res.length ? `${res.length} résultat${res.length > 1 ? 's' : ''} attendu${res.length > 1 ? 's' : ''}, ${nStrat(res)} stratégie${nStrat(res) > 1 ? 's' : ''}` : 'Aucun lien stratégique'}${p.libre ? ', saisi en texte libre' : ''}</small></button>`;

  const cur = list.find(x => x.p.key === S.pvSel), p = cur.p, res = cur.res;
  const lien = {label: p.label, pct: p.pct, statut: p.statut};
  const col = p.pct === undefined ? null : lienColor(lien);
  const stProj = p.statut || (typeof p.pct === 'number' ? statutAuto(p.pct) : '');
  const meta = [p.nature, p.groupement].filter(Boolean).map(esc).join(', ');
  const info = rattachInfo(p), editing = S.pvEdit && S.pvEdit.key === p.key;
  let html = `<div class="panel"><div class="phead"><div><h3>${esc(p.label)}</h3>
      <div class="meta">${meta ? `<span>${meta}</span>` : ''}${p.libre ? '<span class="tag">Lien saisi en texte libre, projet non retrouvé dans ' + esc(CONFIG.tableProjets) + '</span>' : ''}</div>
      ${info.ok && !editing ? `<div class="pbar"><button class="btn ghost" data-pvopen>Rattacher à des résultats</button></div>` : ''}</div>
    ${p.pct === undefined ? '' : `<div class="prog" style="--c:${col || 'var(--muted)'}">
      ${stProj ? (col ? `<span class="st" style="--c:${col};color:${lienText(lien)}">${esc(stProj)}</span>` : `<span class="st neutre">${esc(stProj)}</span>`) : ''}
      ${typeof p.pct === 'number' ? `<span class="pb"><i style="width:${p.pct}%"></i></span><b>${pctTxt(p.pct)} d'avancement projet</b>` : '<span class="status">Avancement non renseigné</span>'}</div>`}</div>`;

  if (S.pvMsg) html += `<div class="ok" role="status">${esc(S.pvMsg)}</div>`;
  if (!info.ok) html += `<div class="note">${esc(info.why)}</div>`;
  if (editing){
    html += panelHtml(p) + `</div>`;
  } else if (!res.length){
    html += `<div class="empty">Ce projet n'est rattaché à aucun résultat attendu${S.pvScope ? ' dans cette stratégie' : ''}.${info.ok ? ' Utilisez « Rattacher à des résultats ».' : ''}</div></div>`;
  } else {
    const a = aggregate(res), nP1 = res.filter(r => r.priorite === 'P1').length;
    html += `<div class="kpis">
      <div class="kpi"><b>${res.length}</b><span>résultat${res.length > 1 ? 's' : ''} attendu${res.length > 1 ? 's' : ''} servi${res.length > 1 ? 's' : ''}, ${nStrat(res)} stratégie${nStrat(res) > 1 ? 's' : ''}</span></div>
      <div class="kpi"><b>${nP1}</b><span>en priorité P1</span></div>
      <div class="kpi"><b>${pctTxt(a.taux)}</b><span>réalisation moyenne de ces résultats${a.byS['Abandonné'] ? ', abandonnés exclus' : ''}</span></div></div>
      <div style="padding:12px"><div class="panel">`;
    for (const s of S.strategies){
      const sRes = res.filter(r => r.strat.id === s.id); if (!sRes.length) continue;
      html += `<div class="obj"><span>${esc(s.label)}</span>${miniBar(sRes)}</div>`;
      for (const [obj, oRes] of groupBy(sRes.sort((x, y) => natCmp(x.code || '999', y.code || '999')), r => r.objectif)){
        html += `<div class="sobj"><span>${esc(obj)}</span>${miniBar(oRes)}</div>`;
        oRes.forEach(r => {
          const via = viaMeo(p, s.id, r.id), canDel = info.ok && via.length && S.pv.meo.stratCols[s.id];
          html += `<div class="pres">
          <button class="pgo" data-goto="${esc(s.id)}|${r.id}" title="Voir dans l'onglet Pilotage"><b>${esc(r.code || '—')}</b>
            <span>${esc(r.resultat.replace(/^\s*[\d.]+\s*/, ''))}</span></button>
          ${prioBadge(r.priorite)}
          <span class="prog" style="--c:${ST_COLOR[r.statut]}">${stBadge(r.statut)}<span class="pb"><i style="width:${r.pct}%"></i></span><b>${pctTxt(r.pct)}</b></span>
          ${canDel ? `<button class="pdel" data-detach="${esc(s.id)}|${r.id}" aria-label="Détacher le résultat ${esc(r.code)} de ce projet" title="Détacher de ce projet">×</button>` : '<span></span>'}</div>`; });
      }
    }
    html += `</div></div>`;
    // autres projets servant les mêmes résultats
    const co = new Map();
    res.forEach(r => r.projets.forEach(k => { if (k !== p.key) co.set(k, (co.get(k) || 0) + 1); }));
    html += `<div class="psec"><h4>Autres projets/actions contribuant aux mêmes résultats</h4>${co.size
      ? `<div class="tags">${[...co].sort((x, y) => y[1] - x[1] || S.pv.projets.get(x[0]).label.localeCompare(S.pv.projets.get(y[0]).label, 'fr'))
          .map(([k, n]) => `<button class="tag" data-proj="${esc(k)}" title="Afficher ce projet">${esc(S.pv.projets.get(k).label)} (${n} résultat${n > 1 ? 's' : ''} en commun)</button>`).join('')}</div>`
      : '<p class="status">Aucun : ce projet est le seul à servir ces résultats.</p>'}</div></div>`;
  }
  body.innerHTML = warn + `<div class="pv"><div class="panel list" role="list" aria-label="Projets et actions">${list.map(item).join('')}</div>${html}</div>`;
  if (editing) pvFilter();
}

/* clic sur un résultat : ouverture de l'onglet Pilotage sur la bonne stratégie, filtres levés, ligne mise en évidence */
async function gotoResult(stratId, rowId){
  S.prios.clear(); S.flags.clear(); S.grp = S.obj = S.fac = S.st = S.txt = '';
  document.querySelectorAll('.chip[data-prio],.chip[data-flag]').forEach(c => c.setAttribute('aria-pressed', 'false'));
  $('#fGrp').value = $('#fObj').value = $('#fFac').value = $('#fSt').value = $('#fTxt').value = '';
  S.openLinks.add(rowId); S.selectedId = rowId;
  if (S.strat.id !== stratId){
    S.strat = S.strategies.find(s => s.id === stratId); S.openLinks = new Set([rowId]);
    try { await grist.setOption('strategie', S.strat.id); } catch(e){}
    S.view = 'pilotage'; await load(); S.selectedId = rowId;
  }
  setView('pilotage');
  const el = document.getElementById('r-' + rowId);
  if (el){ el.scrollIntoView({block: 'center'}); el.classList.add('flash'); }
}

/* ---------- navigation ---------- */
const confirmLeave = () => !S.dirty || confirm('Des modifications ne sont pas enregistrées. Les abandonner ?');
function setView(v){
  if (S.view === 'saisie' && v !== 'saisie' && !confirmLeave()) return;
  if (S.view === 'projets' && v !== 'projets'){ if (!confirmPv()) return; S.pvEdit = null; S.pvMsg = ''; }
  S.view = v; S.dirty = false;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'v-' + v));
  // la vue par projet a ses propres filtres et couvre toutes les stratégies
  $('.filters').hidden = v === 'projets'; $('#expBtn').hidden = v === 'projets'; $('#strat').hidden = v === 'projets';
  render();
}
function selectRow(id, openEdit){
  if (S.view === 'saisie' && id !== S.selectedId && !confirmLeave()) return;
  S.selectedId = id; S.dirty = false;
  if (S.attached === S.strat.id){ try { grist.setCursorPos({rowId: id}); } catch(e){} }
  if (openEdit && S.view !== 'saisie') setView('saisie'); else render();
}
$('#strat').addEventListener('change', async e => {
  if (!confirmLeave()){ e.target.value = S.strat.id; return; }
  S.strat = S.strategies.find(s => s.id === e.target.value); S.selectedId = null; S.openLinks.clear(); S.dirty = false;
  try { await grist.setOption('strategie', S.strat.id); } catch(err){}
  load();
});
$('#refresh').addEventListener('click', () => { if (confirmLeave()){ S.dirty = false; S.refLabels = {}; S.meta = null; S.refCache = {}; load(); } });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));
document.querySelectorAll('.chip[data-flag]').forEach(ch => ch.addEventListener('click', () => {
  const k = ch.dataset.flag; S.flags.has(k) ? S.flags.delete(k) : S.flags.add(k);
  ch.setAttribute('aria-pressed', S.flags.has(k)); render();
}));
document.querySelectorAll('.chip[data-prio]').forEach(ch => ch.addEventListener('click', () => {
  const p = ch.dataset.prio; S.prios.has(p) ? S.prios.delete(p) : S.prios.add(p);
  ch.setAttribute('aria-pressed', S.prios.has(p)); render();
}));
$('#fGrp').addEventListener('change', e => { S.grp = e.target.value; render(); });
$('#fObj').addEventListener('change', e => { S.obj = e.target.value; render(); });
$('#fFac').addEventListener('change', e => { S.fac = e.target.value; render(); });
$('#fSt').addEventListener('change', e => { S.st = e.target.value; render(); });
$('#fTxt').addEventListener('input', e => { S.txt = e.target.value; render(); });
$('#pBody').addEventListener('change', e => {
  const ck = e.target.closest('[data-pk]'); if (ck){ pvToggle(ck.dataset.pk, ck.checked); return; }
  const sel = e.target.closest('[data-meo]');
  if (sel){ const d = S.pvEdit.draft.get(sel.dataset.meo); if (d) d.meo = +sel.value; }
});
$('#pBody').addEventListener('input', e => {
  if (e.target.id === 'pvQ'){ S.pvEdit.q = e.target.value; pvFilter(); }
  if (e.target.id === 'pvAuteur'){ e.target.classList.remove('invalid'); $('#pvStatus').textContent = ''; }
});
$('#pTools').addEventListener('input', e => {
  if (S.pvEdit && !confirmPv()){ e.target.value = e.target.id === 'pScope' ? S.pvScope : e.target.id === 'pNat' ? S.pvNat : S.pvTxt; return; }
  if (S.pvEdit){ S.pvEdit = null; S.dirty = false; }
  if (e.target.id === 'pScope') S.pvScope = e.target.value;
  if (e.target.id === 'pNat') S.pvNat = e.target.value;
  if (e.target.id === 'pTxt') S.pvTxt = e.target.value;
  renderProjets();
});
$('#reset').addEventListener('click', () => {
  S.prios.clear(); S.flags.clear(); S.grp = S.obj = S.fac = S.st = S.txt = '';
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  $('#fGrp').value = $('#fObj').value = $('#fFac').value = $('#fSt').value = $('#fTxt').value = '';
  render();
});
document.querySelector('main').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed){ selectRow(+ed.dataset.edit, true); return; }
  const se = e.target.closest('[data-select]'); if (se){ selectRow(+se.dataset.select, false); return; }
  const pj = e.target.closest('[data-proj]');
  if (pj){ if (pj.dataset.proj === S.pvSel || !confirmPv()) return;
    S.pvEdit = null; S.dirty = false; S.pvMsg = ''; S.pvSel = pj.dataset.proj; renderProjets(); $('#pBody').scrollIntoView({block: 'nearest'}); return; }
  const go = e.target.closest('[data-goto]'); if (go){ if (!confirmPv()) return; S.pvEdit = null; S.dirty = false; const [t, id] = go.dataset.goto.split('|'); gotoResult(t, +id); return; }
  if (e.target.closest('[data-pvopen]')){ S.pvMsg = ''; const pp = S.pv.projets.get(S.pvSel);
    S.pvEdit = {key: S.pvSel, strat: S.pvScope || (pp.results.find(r => S.pv.meo.stratCols[r.strat.id]) || {strat: {}}).strat.id || '', q: '', draft: new Map()}; renderProjets(); $('#pvQ') && $('#pvQ').focus(); return; }
  if (e.target.closest('[data-pvcancel]')){ if (!confirmPv()) return; S.pvEdit = null; S.dirty = false; renderProjets(); return; }
  if (e.target.closest('[data-pvsave]')){ pvSave(); return; }
  const ps = e.target.closest('[data-pvstrat]'); if (ps){ S.pvEdit.strat = ps.dataset.pvstrat; renderProjets(); return; }
  const dt = e.target.closest('[data-detach]'); if (dt){ const [t, id] = dt.dataset.detach.split('|'); S.pvMsg = ''; pvDetach(t, +id); return; }
  if (e.target.closest('#pNoLink')){ S.pvNoLink = !S.pvNoLink; renderProjets(); return; }
  const lk = e.target.closest('[data-links]');
  if (lk){ const id = +lk.dataset.links; S.openLinks.has(id) ? S.openLinks.delete(id) : S.openLinks.add(id); render(); }
});

/* ---------- branchement Grist ---------- */
let timer = null;
const reload = () => { clearTimeout(timer); timer = setTimeout(() => { if (!S.dirty) load(); }, 300); };
grist.ready({requiredAccess: 'full'});
(async () => { try { S.attached = await grist.getSelectedTableId(); } catch(e){} load(); })();
grist.onRecords(reload);  // se rafraîchit quand la table à laquelle le widget est rattaché change
grist.onRecord(rec => {
  if (!rec || S.attached !== S.strat?.id || rec.id === S.selectedId || S.dirty) return;
  S.selectedId = rec.id; if (S.view === 'saisie') render();
});
</script>
</body>
</html>
