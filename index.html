<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilotage stratégique</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --ink:#2b2f36; --muted:#6e6a62; --paper:#f7f5f0; --card:#fff; --line:#e6e1d6; --track:#efebe3;
  --accent:#2f4a6d; --accent-soft:#e7ecf3;
  --p1:#b5473a; --p1-soft:#f6e3df; --p2:#a87522; --p2-soft:#f7edd9; --p3:#5e7a8c; --p3-soft:#e6edf1;
  --s-eng:#f1bcb4; --s-cours:#d9a441; --s-real:#4e8b6a; --s-aband:#6b6f76;
  --ko:#b5473a; --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Marianne,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:13px;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px 0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.strat{font-size:15px;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.refresh{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:3px 10px;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"].P1{background:var(--p1);border-color:var(--p1);color:#fff}
.chip[aria-pressed="true"].P2{background:var(--p2);border-color:var(--p2);color:#fff}
.chip[aria-pressed="true"].P3{background:var(--p3);border-color:var(--p3);color:#fff}
.filters select,.filters input[type=search]{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;max-width:200px}
.filters input[type=search]{width:160px}
.check{display:flex;align-items:center;gap:4px;color:var(--muted)}
.reset{border:0;background:none;color:var(--accent);cursor:pointer;text-decoration:underline}
.count{margin-left:auto;color:var(--muted)}
.exp{position:relative}
.exp-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 18px rgba(43,47,54,.12);padding:4px;min-width:210px}
.exp-menu.open{display:block}
.exp-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.exp-menu button:hover{background:var(--accent-soft);color:var(--accent)}

main{flex:1;overflow:auto;padding:12px}
.view{display:none}.view.active{display:block}
.banner{margin-bottom:12px;padding:10px 12px;border-radius:var(--radius);border:1px solid #e7b9b5;background:#fdf3f2;color:var(--ko);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.info{border-color:#c9d6e6;background:var(--accent-soft);color:var(--accent)}

/* Bandeau de réalisation */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.big{font-size:44px;font-weight:800;line-height:1;color:var(--accent)}
.big small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.gauge{position:relative;height:14px;background:var(--track);border-radius:7px}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:7px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:12px;background:var(--track)}
.stack i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.kpi b{display:block;font-size:20px;line-height:1.15;color:var(--accent)}
.kpi span{color:var(--muted)}
.kpi.alert{border-left-color:var(--ko)}

.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px;align-items:start}
@media (max-width:950px){.two{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel h2{font-size:14px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.obj,.sobj{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;padding:8px 12px}
.obj{background:var(--accent-soft);color:var(--accent);font-weight:700;border-top:1px solid var(--line)}
.obj:first-child{border-top:0}
.sobj{background:var(--paper);font-weight:600;color:var(--accent);border-top:1px solid var(--line)}
.mini{display:flex;align-items:center;gap:6px;font-weight:700}
.mini .pb{flex:1;height:6px;background:#fff;border-radius:3px;overflow:hidden}
.mini .pb i{display:block;height:100%;background:currentColor}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:10px;padding:8px 12px;border-top:1px solid var(--line);align-items:start}
.row:hover{background:#fbfaf7}
.title{cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;color:var(--muted);align-items:center}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;font-size:11px}
.badge.P1{background:var(--p1-soft);color:var(--p1)}.badge.P2{background:var(--p2-soft);color:var(--p2)}.badge.P3{background:var(--p3-soft);color:var(--p3)}
.badge.nd{background:var(--track);color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px;background:#fff}
.st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;background:var(--c)}
.prog{display:flex;flex-direction:column;gap:3px}
.prog .pb{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--c)}
.prog b{font-size:12px}
.links-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 9px;cursor:pointer;white-space:nowrap}
.links{grid-column:1 / 4;margin:4px 0 0;padding:6px 10px;background:var(--paper);border-left:3px solid var(--accent);border-radius:0;list-style:none}
.links li{padding:2px 0}
table.grp{width:100%;border-collapse:collapse}
table.grp th,table.grp td{padding:6px 8px;border-top:1px solid var(--line);text-align:right}
table.grp th:first-child,table.grp td:first-child{text-align:left}
table.grp thead th{border-top:0;color:var(--muted);font-weight:600}

/* Matrice */
.matrix{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px}
.mhead{font-weight:700;text-align:center;padding:6px;color:var(--accent)}
.mrow{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;border-left:4px solid;border-radius:0}
.mrow.P1{background:var(--p1-soft);color:var(--p1)}.mrow.P2{background:var(--p2-soft);color:var(--p2)}.mrow.P3{background:var(--p3-soft);color:var(--p3)}
.cell{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);min-height:120px;padding:10px}
.cell .ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.cell .ch em{font-style:normal;color:var(--muted)}
.card{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:5px 7px 5px 0;margin-top:5px;cursor:pointer;border-radius:6px;align-items:center;overflow:hidden}
.card::before{content:"";align-self:stretch;background:var(--c)}
.card:hover{border-color:var(--accent)}
.card small{color:var(--muted);display:block}
.card .pct{font-weight:700}
.unq{margin-top:12px}

/* Saisie */
.edit{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.edit{grid-template-columns:1fr}}
.list{max-height:calc(100vh - 170px);overflow:auto}
.item{display:grid;grid-template-columns:40px 1fr;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;padding:7px 10px;cursor:pointer}
.item b{color:var(--c)}
.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.form{padding:14px}
.form h3{margin:0 0 4px;font-size:15px}
.ctx{color:var(--muted);margin-bottom:12px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 12px;margin:0 0 12px}
legend{font-weight:700;color:var(--accent);padding:0 4px}
.avc{display:grid;grid-template-columns:minmax(0,1fr) 80px auto;gap:12px;align-items:center}
.avc input[type=range]{width:100%;accent-color:var(--accent)}
.avc input[type=number]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:80px}
.avc-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600}
label.f input,label.f textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-weight:400;background:#fff}
label.full{grid-column:1 / 3}
textarea{min-height:70px;resize:vertical}
.invalid{border-color:var(--ko)!important;background:#fdf3f2!important}
.msgs{margin:0;padding:0;list-style:none}
.msgs li{padding:4px 8px;margin-top:4px;border-radius:3px}
.msgs .err{background:#fdf3f2;color:var(--ko)}.msgs .wrn{background:#fdf6ea;color:#8a5300}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px}
.btn{border:0;background:var(--accent);color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.status{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.thread{list-style:none;margin:0 0 10px;padding:0;max-height:260px;overflow:auto}
.thread li{border-left:3px solid var(--accent-soft);border-radius:0;padding:6px 10px;margin-bottom:8px;background:var(--paper)}
.thread li.legacy{border-left-color:var(--s-eng)}
.thread .who{font-size:11px;color:var(--muted);margin-bottom:3px}
.thread .who b{color:var(--ink)}
.thread .txt{white-space:pre-wrap}
.addc{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.addc label{width:min(100%,320px)}
.addc textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
</style>
</head>
<body>
<header>
  <div class="top">
    <select id="strat" class="strat" aria-label="Stratégie"></select>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="pilotage" aria-selected="true">Pilotage</button>
      <button class="tab" role="tab" data-view="matrice" aria-selected="false">Matrice priorité × facilité</button>
      <button class="tab" role="tab" data-view="saisie" aria-selected="false">Saisie</button>
    </nav>
    <button class="refresh" id="refresh" title="Relire les données">Actualiser</button>
    <div class="exp">
      <button class="refresh" id="expBtn" aria-haspopup="true" aria-expanded="false" title="Exporter la stratégie affichée, filtres compris">Exporter ▾</button>
      <div class="exp-menu" id="expMenu" role="menu">
        <button role="menuitem" data-exp="pdf">Rapport PDF</button>
        <button role="menuitem" data-exp="odp">Diaporama Impress (.odp)</button>
        <button role="menuitem" data-exp="xlsx">Tableur (.xlsx)</button>
      </div>
    </div>
  </div>
  <div class="filters">
    <button class="chip P1" data-prio="P1" aria-pressed="false">P1</button>
    <button class="chip P2" data-prio="P2" aria-pressed="false">P2</button>
    <button class="chip P3" data-prio="P3" aria-pressed="false">P3</button>
    <select id="fGrp" aria-label="Groupement pilote"></select>
    <select id="fObj" aria-label="Orientation"></select>
    <select id="fFac" aria-label="Facile à atteindre">
      <option value="">Facilité : toutes</option><option value="Oui">Facile : oui</option><option value="Non">Facile : non</option>
    </select>
    <select id="fSt" aria-label="Statut"></select>
    <input id="fTxt" type="search" placeholder="Rechercher…" aria-label="Rechercher">
    <button class="reset" id="reset">Réinitialiser</button>
    <span class="count" id="count"></span>
  </div>
</header>

<main>
  <div id="banner"></div>
  <section class="view active" id="v-pilotage"></section>
  <section class="view" id="v-matrice"></section>
  <section class="view" id="v-saisie"></section>
</main>

<script>
/* =========================================================
   CONFIGURATION
   ========================================================= */
const CONFIG = {
  // Tables de stratégie détectées automatiquement : Recap_SDACR_25_30, Recap_PE_23_28…
  prefixeTables: /^Recap_(SDACR|PE)_(\d{2})_(\d{2})$/i,
  nomsTypes: {SDACR: 'SDACR', PE: "Projet d'établissement"},
  // Noms de colonnes acceptés (accents, espaces et casse ignorés)
  cols: {
    objectif:     ['ID_Objectif'],
    sousObjectif: ['ID_Sous_Objectif', 'ID_Sous Objectif'],
    resultat:     ['Resultat_Attendu'],
    priorite:     ['Priorite'],
    facile:       ['Facile_a_atteindre'],
    groupement:   ['Groupement_Porteur', 'Groupement_Pilote'],
    t0:           ['Valeur_T0'],
    cible:        ['Cible'],
    observation:  ['Observation'],
    liens:        ['ID_Projet_Action'],
    avancement:   ['Avancement', 'Taux_Avancement'],
    statut:       ['Statut', 'Etat_Realisation'],
    dateMaj:      ['Date_Maj', 'Date_MAJ_Avancement']
  },
  // Table unique d'historique des commentaires (toutes stratégies)
  tableObs: 'Observations',
  colsObs: {strategie: ['Strategie'], idResultat: ['ID_Resultat'], resultat: ['Resultat_Attendu'], texte: ['Commentaire'],
            nom: ['Auteur', 'Auteur_Nom'], date: ['Date_Commentaire'], email: ['Auteur_Email']},
  tableProjets: 'Liste_PEPS_AV',
  colLibelleProjet: ['ID_Projet_Action', 'ID_Projet_Action_AV', 'Libelle', 'Intitule', 'Nom']
};

const STATUTS = ['À engager', 'En cours', 'Réalisé', 'Abandonné'];
const ST_COLOR = {'À engager': 'var(--s-eng)', 'En cours': 'var(--s-cours)', 'Réalisé': 'var(--s-real)', 'Abandonné': 'var(--s-aband)'};
const MATRICE = {'P1|Oui': 'Gains rapides', 'P1|Non': 'Chantiers stratégiques', 'P2|Oui': 'À engager rapidement',
                 'P2|Non': 'À planifier', 'P3|Oui': 'Opportunités', 'P3|Non': 'À différer'};

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const isEmpty = v => v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v));
const fmt = v => isEmpty(v) ? '—' : (typeof v === 'number' ? v.toLocaleString('fr-FR') : String(v));
const pctTxt = v => v === null ? '—' : Math.round(v) + ' %';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const codeOf = s => (String(s || '').match(/^\s*([\d.]+)/) || [,''])[1].replace(/\.$/, '');
function natCmp(a, b){
  const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++){
    const x = pa[i] ?? -1, y = pb[i] ?? -1;
    if (x !== y) return (isNaN(x) ? 1e9 : x) - (isNaN(y) ? 1e9 : y);
  }
  return 0;
}
function resolveCol(keys, cands){
  const m = {}; keys.forEach(k => m[norm(k)] = k);
  for (const c of cands) if (m[norm(c)]) return m[norm(c)];
  return null;
}
const normPrio = v => { const m = String(v || '').toUpperCase().match(/P\s*([123])/); return m ? 'P' + m[1] : ''; };
const normFac = v => { if (v === true) return 'Oui'; if (v === false) return 'Non';
  const s = norm(v || ''); return s.startsWith('oui') ? 'Oui' : s.startsWith('non') ? 'Non' : ''; };
const statutAuto = pct => pct >= 100 ? 'Réalisé' : pct > 0 ? 'En cours' : 'À engager';
function readPct(v){ // accepte 0–1 (format % Grist) ou 0–100
  if (isEmpty(v) || isNaN(Number(v))) return 0;
  const n = Number(v); return clamp(n <= 1 ? n * 100 : n, 0, 100);
}
function dateFromGrist(v){ if (isEmpty(v)) return null; const d = new Date(Number(v) * 1000); return isNaN(d) ? null : d; }
const dFr = d => d ? d.toLocaleDateString('fr-FR') : '—';

/* ---------- état ---------- */
const S = {
  strategies: [], strat: null, colIds: {}, rows: [], refLabels: {}, attached: null,
  view: 'pilotage', prios: new Set(), grp: '', obj: '', fac: '', st: '', txt: '',
  selectedId: null, openLinks: new Set(), dirty: false, obs: {}, obsCols: null, auteur: '', meta: null, refCache: {}
};

/* ---------- stratégies disponibles ---------- */
async function listStrategies(){
  const ids = await grist.docApi.listTables();
  return ids.filter(t => CONFIG.prefixeTables.test(t)).map(t => {
    const m = t.match(CONFIG.prefixeTables), type = m[1].toUpperCase();
    const start = 2000 + +m[2], end = 2000 + +m[3];
    return {id: t, type, start, end, label: `${CONFIG.nomsTypes[type] || type} ${start}-${end}`};
  }).sort((a, b) => a.type.localeCompare(b.type) || b.start - a.start);
}
function fillStrategySelect(){
  $('#strat').innerHTML = S.strategies.map(s => `<option value="${esc(s.id)}" ${s.id === S.strat?.id ? 'selected' : ''}>${esc(s.label)}</option>`).join('');
}

/* ---------- liens projets/actions ---------- */
function collectRefs(v, out){
  if (v === null || v === undefined || v === '') return;
  if (Array.isArray(v)){
    if (v[0] === 'L'){ v.slice(1).forEach(x => collectRefs(x, out)); return; }
    if (v[0] === 'R'){ if (v[2]) out.push({t: v[1], id: v[2]}); return; }
    if (v[0] === 'r'){ (v[2] || []).forEach(id => id && out.push({t: v[1], id})); return; }
    v.forEach(x => collectRefs(x, out)); return;
  }
  if (typeof v === 'number'){ if (v > 0) out.push({t: null, id: v}); return; }
  if (typeof v === 'string'){
    const s = v.trim(); if (!s) return;
    if (s.startsWith('[')){ try { collectRefs(JSON.parse(s), out); return; } catch(e){} }
    s.split(/\n|;/).map(x => x.trim()).filter(Boolean).forEach(x => out.push({label: x}));
  }
}
/* ---------- colonnes de type Référence : affichage du libellé au lieu de l'identifiant ---------- */
async function loadMeta(){
  if (S.meta) return S.meta;
  const t = await grist.docApi.fetchTable('_grist_Tables');
  const c = await grist.docApi.fetchTable('_grist_Tables_column');
  const tables = {}; t.id.forEach((id, i) => tables[id] = t.tableId[i]);
  const cols = c.id.map((id, i) => ({id, table: tables[c.parentId[i]], colId: c.colId[i], type: c.type[i], visibleCol: c.visibleCol[i]}));
  return S.meta = {cols, byId: Object.fromEntries(cols.map(x => [x.id, x]))};
}
async function refResolver(tableId, colId){
  try {
    const m = await loadMeta();
    const col = m.cols.find(x => x.table === tableId && x.colId === colId);
    const tm = col && String(col.type).match(/^Ref(?:List)?:(.+)$/); if (!tm) return null;
    const target = tm[1];
    S.refCache[target] = S.refCache[target] || await grist.docApi.fetchTable(target);
    const raw = S.refCache[target];
    let lab = col.visibleCol && m.byId[col.visibleCol] ? m.byId[col.visibleCol].colId : null;
    if (!lab || !raw[lab]) lab = Object.keys(raw).find(k => k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper') && raw[k].some(v => typeof v === 'string' && v.trim()));
    const map = {}; raw.id.forEach((id, i) => map[id] = lab ? raw[lab][i] : id);
    const one = v => (typeof v === 'number' ? (v > 0 ? map[v] ?? '' : '') : v);
    return v => Array.isArray(v) && v[0] === 'L' ? v.slice(1).map(one).filter(x => x !== '').join(', ') : one(v);
  } catch(e){ return null; }
}

async function loadRefTables(tables){
  for (const t of tables){
    if (S.refLabels[t]) continue;
    try {
      const raw = await grist.docApi.fetchTable(t);
      const keys = Object.keys(raw).filter(k => k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper'));
      let lab = resolveCol(keys, CONFIG.colLibelleProjet);
      if (!lab) lab = keys.find(k => raw[k].some(x => typeof x === 'string' && x.trim())) || null;
      const m = {};
      raw.id.forEach((id, i) => {
        const label = lab ? String(raw[lab][i] ?? '') : '#' + id;
        m[id] = {label: label || '#' + id};
      });
      S.refLabels[t] = m;
    } catch(e){ S.refLabels[t] = {}; }
  }
}

/* ---------- chargement ---------- */
async function load(){
  const banner = $('#banner');
  try {
    S.strategies = await listStrategies();
    if (!S.strategies.length){
      banner.innerHTML = `<div class="banner">Aucune table de stratégie trouvée. Les tables doivent être nommées Recap_SDACR_AA_AA ou Recap_PE_AA_AA (ex. Recap_SDACR_25_30).</div>`;
      ['pilotage','matrice','saisie'].forEach(v => $('#v-' + v).innerHTML = '');
      return;
    }
    if (!S.strat || !S.strategies.some(s => s.id === S.strat.id)){
      let saved = null; try { saved = await grist.getOption('strategie'); } catch(e){}
      S.strat = S.strategies.find(s => s.id === saved) || S.strategies.find(s => s.id === S.attached) || S.strategies[0];
    } else S.strat = S.strategies.find(s => s.id === S.strat.id);
    fillStrategySelect();

    const raw = await grist.docApi.fetchTable(S.strat.id);
    const keys = Object.keys(raw);
    const missing = [];
    for (const [k, c] of Object.entries(CONFIG.cols)){
      S.colIds[k] = resolveCol(keys, c);
      if (!S.colIds[k]) missing.push(k);
    }
    banner.innerHTML = missing.length
      ? `<div class="banner">Colonnes introuvables dans ${esc(S.strat.id)} : ${missing.map(k => esc(CONFIG.cols[k][0])).join(', ')}. Créez-les ou ajustez CONFIG.cols en tête du widget.</div>` : '';

    const resolvers = {};
    for (const k of ['objectif', 'sousObjectif', 'resultat', 'priorite', 'facile', 'groupement']){
      if (S.colIds[k]) resolvers[k] = await refResolver(S.strat.id, S.colIds[k]);
    }
    const get = (k, i) => { if (!S.colIds[k]) return null; const v = raw[S.colIds[k]][i]; return resolvers[k] ? resolvers[k](v) : v; };
    const refTables = new Set();
    const rows = raw.id.map((id, i) => {
      const refs = []; collectRefs(get('liens', i), refs);
      refs.forEach(r => { if (r.id) refTables.add(r.t || CONFIG.tableProjets); });
      const resultat = String(get('resultat', i) ?? '');
      const pct = readPct(get('avancement', i));
      const stRaw = String(get('statut', i) ?? '');
      const statut = norm(stRaw) === 'abandonne' ? 'Abandonné' : statutAuto(pct);
      return {
        id, refs, resultat, code: codeOf(resultat),
        objectif: String(get('objectif', i) ?? '') || 'Sans orientation',
        sousObjectif: String(get('sousObjectif', i) ?? '') || 'Sans sous-objectif',
        priorite: normPrio(get('priorite', i)), facile: normFac(get('facile', i)),
        groupement: String(get('groupement', i) ?? '').trim(),
        t0: get('t0', i), cible: get('cible', i), observation: get('observation', i),
        pct, statut, statutStocke: stRaw, dateMaj: dateFromGrist(get('dateMaj', i)),
      };
    });
    await loadRefTables([...refTables]);
    await loadObservations();
    if (!S.obsCols) banner.insertAdjacentHTML('beforeend', `<div class="banner info">Table ${esc(CONFIG.tableObs)} introuvable ou incomplète (colonnes Strategie, ID_Resultat, Commentaire et Auteur requises) : les commentaires sont désactivés.</div>`);
    rows.forEach(r => {
      const seen = new Set(); r.links = [];
      r.refs.forEach(ref => {
        const item = ref.label ? {label: ref.label}
          : ((S.refLabels[ref.t || CONFIG.tableProjets] || {})[ref.id] || {label: '#' + ref.id});
        if (!seen.has(item.label)){ seen.add(item.label); r.links.push(item); }
      });
      r.comments = S.obs[r.id] || [];
    });
    rows.sort((a, b) => natCmp(a.code || '999', b.code || '999') || a.resultat.localeCompare(b.resultat, 'fr'));
    S.rows = rows;
    if (!rows.some(r => r.id === S.selectedId)) S.selectedId = rows[0]?.id ?? null;
    fillFilterOptions();
    render();
  } catch(e){
    banner.innerHTML = `<div class="banner">Lecture impossible : ${esc(e.message || e)}. Vérifiez que le widget a l'accès complet au document.</div>`;
  }
}

/* ---------- historique des commentaires ---------- */
async function loadObservations(){
  S.obs = {}; S.obsCols = null;
  let raw;
  try {
    const tables = await grist.docApi.listTables();
    const t = tables.find(x => norm(x) === norm(CONFIG.tableObs)); if (!t) return;
    CONFIG.tableObs = t;
    raw = await grist.docApi.fetchTable(t);
  } catch(e){ return; }
  const keys = Object.keys(raw), c = {};
  for (const [k, cands] of Object.entries(CONFIG.colsObs)) c[k] = resolveCol(keys, cands);
  if (!c.strategie || !c.idResultat || !c.texte || !c.nom) return;
  S.obsCols = c;
  raw.id.forEach((id, i) => {
    if (raw[c.strategie][i] !== S.strat.id) return;
    const rid = Number(raw[c.idResultat][i]); if (!rid) return;
    (S.obs[rid] = S.obs[rid] || []).push({
      id, texte: String(raw[c.texte][i] ?? ''),
      email: c.email ? String(raw[c.email][i] ?? '') : '', nom: c.nom ? String(raw[c.nom][i] ?? '') : '',
      date: c.date ? dateFromGrist(raw[c.date][i]) : null
    });
  });
  Object.values(S.obs).forEach(l => l.sort((a, b) => (b.date || 0) - (a.date || 0) || b.id - a.id));
}
async function addComment(){
  if (!S.obsCols) return;
  const txt = $('#iCm').value.trim(), auteur = $('#iAu').value.trim();
  $('#iAu').classList.toggle('invalid', !auteur); $('#iCm').classList.toggle('invalid', !txt);
  if (!auteur || !txt){ $('#cmStatus').textContent = !auteur ? "Saisissez le nom de l'auteur." : 'Saisissez le commentaire.'; return; }
  S.auteur = auteur;
  const r = S.rows.find(x => x.id === S.selectedId), c = S.obsCols, rec = {};
  rec[c.strategie] = S.strat.id; rec[c.idResultat] = r.id; rec[c.texte] = txt; rec[c.nom] = auteur;
  if (c.date) rec[c.date] = Date.now() / 1000;
  if (c.resultat) rec[c.resultat] = r.resultat;
  $('#addCm').disabled = true; $('#cmStatus').textContent = 'Ajout…';
  try {
    await grist.docApi.applyUserActions([['AddRecord', CONFIG.tableObs, null, rec]]);
    await loadObservations();
    S.rows.forEach(x => x.comments = S.obs[x.id] || []);
    // mise à jour du seul fil : les modifications en cours sur l'avancement ne sont pas perdues
    $('#thread').innerHTML = threadHtml(r); $('#iCm').value = ''; $('#addCm').disabled = true; $('#cmStatus').textContent = 'Commentaire ajouté.';
  } catch(e){
    $('#cmStatus').textContent = "Échec de l'ajout : " + (e.message || e); $('#addCm').disabled = false;
  }
}
const dtFr = d => d ? d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}) : 'date inconnue';
function threadHtml(r){
  const items = r.comments.map(c => `<li><div class="who"><b>${esc(c.nom || 'Auteur inconnu')}</b>${c.email ? ' (' + esc(c.email) + ')' : ''}, le ${esc(dtFr(c.date))}</div><div class="txt">${esc(c.texte)}</div></li>`);
  if (!isEmpty(r.observation)) items.push(`<li class="legacy"><div class="who">Observation saisie dans la table, sans auteur ni date</div><div class="txt">${esc(r.observation)}</div></li>`);
  return items.length ? `<ul class="thread">${items.join('')}</ul>` : '<p class="status">Aucun commentaire pour ce résultat.</p>';
}

/* ---------- agrégats ---------- */
function aggregate(rows){
  const actifs = rows.filter(r => r.statut !== 'Abandonné');
  let sw = 0, sp = 0;
  actifs.forEach(r => { sw += 1; sp += r.pct; });
  const byS = {}; STATUTS.forEach(s => byS[s] = 0); rows.forEach(r => byS[r.statut]++);
  return {n: rows.length, nActifs: actifs.length, taux: sw ? sp / sw : null, byS};
}
function miniBar(rows){
  const a = aggregate(rows);
  return `<span class="mini"><span class="pb"><i style="width:${a.taux ?? 0}%"></i></span>${pctTxt(a.taux)}</span>`;
}

/* ---------- filtres ---------- */
function fillFilterOptions(){
  const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr', {numeric: true}));
  const setOpts = (sel, first, vals, cur) => {
    if (cur && !vals.includes(cur)) cur = '';
    sel.innerHTML = `<option value="">${first}</option>` + vals.map(v => `<option ${v === cur ? 'selected' : ''} value="${esc(v)}">${esc(v)}</option>`).join('');
    return cur;
  };
  S.grp = setOpts($('#fGrp'), 'Groupement : tous', uniq(S.rows.map(r => r.groupement)), S.grp);
  S.obj = setOpts($('#fObj'), 'Orientation : toutes', uniq(S.rows.map(r => r.objectif)), S.obj);
  S.st = setOpts($('#fSt'), 'Statut : tous', STATUTS, S.st);
}
function filtered(){
  const q = norm(S.txt);
  return S.rows.filter(r =>
    (!S.prios.size || S.prios.has(r.priorite)) && (!S.grp || r.groupement === S.grp) &&
    (!S.obj || r.objectif === S.obj) && (!S.fac || r.facile === S.fac) && (!S.st || r.statut === S.st) &&
    (!q || norm(r.resultat + ' ' + r.sousObjectif + ' ' + (r.observation || '') + ' ' + r.comments.map(c => c.texte + ' ' + c.nom).join(' ') + ' ' + r.links.map(l => l.label).join(' ')).includes(q)));
}

/* ---------- rendu ---------- */
function render(){
  const rows = filtered();
  $('#count').textContent = `${rows.length} / ${S.rows.length} résultats attendus`;
  if (S.view === 'pilotage') renderPilotage(rows);
  if (S.view === 'matrice') renderMatrice(rows);
  if (S.view === 'saisie') renderSaisie(rows);
}
const prioBadge = p => p ? `<span class="badge ${p}">${p}</span>` : `<span class="badge nd">Sans priorité</span>`;
const ST_TEXT = {'À engager': '#7a2e24', 'En cours': '#4a3508', 'Réalisé': '#fff', 'Abandonné': '#fff'};
const stBadge = s => `<span class="st" style="--c:${ST_COLOR[s]};color:${ST_TEXT[s]}">${esc(s)}</span>`;
function indicText(r){
  if ([r.t0, r.cible].every(isEmpty)) return '';
  return `T0 ${fmt(r.t0)} → cible ${fmt(r.cible)}`;
}
function linksLabel(r){
  const n = r.links.length; if (!n) return '';
  const s = n > 1 ? 's' : '';
  return `${n} projet${s}/action${s} lié${s}`;
}

  const a = aggregate(rows);
  const lastMaj = rows.reduce((m, r) => r.dateMaj && (!m || r.dateMaj > m) ? r.dateMaj : m, null);

  let html = `<div class="hero">

    </div></div>

    <div class="kpi"><b style="color:var(--s-real)">${a.byS['Réalisé']}</b><span>résultat${a.byS['Réalisé'] > 1 ? 's' : ''} réalisé${a.byS['Réalisé'] > 1 ? 's' : ''}</span></div>
    <div class="kpi"><b>${dFr(lastMaj)}</b><span>dernière mise à jour${jamais ? `, ${jamais} jamais évalué${jamais > 1 ? 's' : ''}` : ''}</span></div>

          <div><div class="title" data-edit="${r.id}" title="Ouvrir la saisie">${esc(r.resultat)}</div>

              ${r.comments.length ? `<span class="tag" title="${esc(r.comments[0].texte.slice(0, 200))}">${r.comments.length} commentaire${r.comments.length > 1 ? 's' : ''}, dernier le ${dFr(r.comments[0].date)}</span>` : ''}
              ${indicText(r) ? `<span>${esc(indicText(r))}</span>` : ''}</div></div>
          <div class="prog" style="--c:${ST_COLOR[r.statut]}">${stBadge(r.statut)}<span class="pb"><i style="width:${r.pct}%"></i></span><b>${pctTxt(r.pct)}</b></div>
          ${r.links.length ? `<button class="links-btn" data-links="${r.id}" aria-expanded="${open}">${esc(linksLabel(r))}</button>` : '<span></span>'}

function groupBy(rows, fn){ const m = new Map(); rows.forEach(r => { const k = fn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }); return m; }
function renderMatrice(rows){
  const el = $('#v-matrice');

      <span><strong>${esc(r.code || '—')}</strong> ${esc(r.resultat.replace(/^\s*[\d.]+\s*/, '').slice(0, 90))}${r.resultat.length > 90 ? '…' : ''}
      <small>${esc(r.groupement || 'Groupement non renseigné')}, ${esc(r.statut.toLowerCase())}${r.links.length ? ', ' + esc(linksLabel(r)) : ''}</small></span>
      <span class="pct">${pctTxt(r.pct)}</span></button>`;
  let html = `<div class="matrix"><div></div><div class="mhead">Facile à atteindre</div><div class="mhead">Difficile à atteindre</div>`;
  ['P1','P2','P3'].forEach(p => {
    html += `<div class="mrow ${p}">${p}</div>`;

      html += `<div class="cell"><div class="ch"><strong>${MATRICE[p + '|' + f]}</strong><em>${items.length} à traiter${nReal ? `, ${nReal} réalisé${nReal > 1 ? 's' : ''}` : ''}</em></div>${items.map(card).join('')}</div>`;

  if (unq.length) html += `<div class="panel unq"><h2>À qualifier (priorité ou facilité manquante) : ${unq.length}</h2><div style="padding:8px">${unq.map(card).join('')}</div></div>`;
  el.innerHTML = html;
}

/* ---------- contrôle et enregistrement ---------- */
function parseNum(s){ s = s.trim().replace(/\s/g, '').replace(',', '.'); if (!s) return null; const n = Number(s); return isNaN(n) ? NaN : n; }
function validate(){
  const pRaw = $('#iPn').value.trim();
  const f = {pct: pRaw === '' ? 0 : Number(pRaw), ab: $('#iAb').checked,
             t0: parseNum($('#iT0').value), ci: parseNum($('#iCi').value)};
  const err = [], wrn = [];
  const mark = (id, bad) => $('#' + id).classList.toggle('invalid', bad);
  const pBad = !Number.isInteger(f.pct) || f.pct < 0 || f.pct > 100;
  mark('iPn', pBad); if (pBad) err.push('Avancement : saisissez un nombre entier entre 0 et 100.');
  mark('iT0', Number.isNaN(f.t0)); if (Number.isNaN(f.t0)) err.push('Valeur T0 : saisissez un nombre.');
  mark('iCi', Number.isNaN(f.ci)); if (Number.isNaN(f.ci)) err.push('Cible : saisissez un nombre.');
  if (f.t0 !== null && f.ci === null) wrn.push('Valeur T0 saisie sans cible.');
  f.statut = f.ab ? 'Abandonné' : statutAuto(pBad ? 0 : f.pct);
  $('#stPrev').innerHTML = stBadge(f.statut);
  $('#msgs').innerHTML = err.map(m => `<li class="err">${esc(m)}</li>`).join('') + wrn.map(m => `<li class="wrn">${esc(m)}</li>`).join('');
  $('#save').disabled = !S.dirty || err.length > 0;
  $('#cancel').disabled = !S.dirty;
  return {ok: !err.length, f};
}
async function save(){
  const {ok, f} = validate(); if (!ok) return;
  const r = S.rows.find(x => x.id === S.selectedId);
  const c = S.colIds, fields = {};
  if (c.t0) fields[c.t0] = f.t0;
  if (c.cible) fields[c.cible] = f.ci;
  if (c.avancement && c.statut){
    fields[c.avancement] = f.pct / 100;
    fields[c.statut] = f.statut;
    const changed = Math.round(r.pct) !== f.pct || r.statutStocke !== f.statut;
    if (c.dateMaj && changed){ const d = new Date(); fields[c.dateMaj] = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000; }
  }
  $('#save').disabled = true; $('#status').textContent = 'Enregistrement…';
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', S.strat.id, S.selectedId, fields]]);
    S.dirty = false; $('#status').textContent = 'Enregistré.';
    await load();
  } catch(e){
    $('#status').textContent = "Échec de l'enregistrement : " + (e.message || e);
    $('#save').disabled = false;
  }
}

/* EXPORT-START */
const EXP = {
  accent: '#2f4a6d', accentSoft: '#e7ecf3', ink: '#2b2f36', muted: '#6e6a62', line: '#e6e1d6', track: '#efebe3', paper: '#f7f5f0',
  prio: {P1: '#b5473a', P2: '#a87522', P3: '#5e7a8c'}, prioSoft: {P1: '#f6e3df', P2: '#f7edd9', P3: '#e6edf1'},
  st: {'À engager': '#f1bcb4', 'En cours': '#d9a441', 'Réalisé': '#4e8b6a', 'Abandonné': '#6b6f76'},
  stText: {'À engager': '#7a2e24', 'En cours': '#4a3508', 'Réalisé': '#ffffff', 'Abandonné': '#ffffff'}
};
const EXP_STATUTS = ['À engager', 'En cours', 'Réalisé', 'Abandonné'];
const EXP_MATRICE = {'P1|Oui': 'Gains rapides', 'P1|Non': 'Chantiers stratégiques', 'P2|Oui': 'À engager rapidement',
                     'P2|Non': 'À planifier', 'P3|Oui': 'Opportunités', 'P3|Non': 'À différer'};
const expNil = v => v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v));
const expNum = v => expNil(v) ? '—' : (typeof v === 'number' ? v.toLocaleString('fr-FR') : String(v));
const expPct = v => v === null || v === undefined ? '—' : Math.round(v) + ' %';
const expDate = d => d ? d.toLocaleDateString('fr-FR') : '';
const expTrunc = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const expT0 = r => expNil(r.t0) && expNil(r.cible) ? '' : `${expNum(r.t0)} → ${expNum(r.cible)}`;
const expCom = r => r.comments && r.comments[0] ? r.comments[0] : null;
const expComTxt = r => { const c = expCom(r); return c ? `${c.texte} (${c.nom || 'auteur inconnu'}, ${expDate(c.date)})` : ''; };
const expRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const expFile = (ctx, ext) => `Pilotage_${ctx.strat.id}_${ctx.date.toISOString().slice(0, 10)}.${ext}`;

/* ----- PDF (jsPDF + autotable) ----- */
function buildPdf(ctx, jsPDF){
  const T = s => String(s ?? '').replace(/[\u202f\u00a0]/g, ' ').replace(/→/g, '->').replace(/…/g, '...')
    .replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/œ/g, 'oe').replace(/Œ/g, 'OE').replace(/[–—]/g, '-').replace(/[^\x00-\xFF]/g, '');
  const doc = new jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
  const W = 297, M = 14, a = ctx.agg;
  const color = (fn, hex) => doc[fn](...expRgb(hex));
  // Synthèse
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); color('setTextColor', EXP.accent);
  doc.text(T(`${ctx.strat.label} - état de réalisation`), M, 20);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); color('setTextColor', EXP.muted);
  doc.text(T(`Situation au ${expDate(ctx.date)} - ${ctx.filtres}`), M, 27);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(40); color('setTextColor', EXP.accent);
  doc.text(T(expPct(a.taux)), M, 50);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); color('setTextColor', EXP.muted);
  doc.text('de réalisation (hors abandonnés)', M, 57);
  const bx = 80, bw = W - M - bx;
  color('setFillColor', EXP.track); doc.roundedRect(bx, 40, bw, 6, 3, 3, 'F');
  if (a.taux > 0){ color('setFillColor', EXP.accent); doc.roundedRect(bx, 40, Math.max(bw * a.taux / 100, 6), 6, 3, 3, 'F'); }
  let x = bx;
  EXP_STATUTS.forEach(s => { const w = a.n ? bw * a.byS[s] / a.n : 0; if (w > 0){ color('setFillColor', EXP.st[s]); doc.rect(x, 50, w, 4, 'F'); x += w; } });
  let lx = bx; doc.setFontSize(9); color('setTextColor', EXP.ink);
  EXP_STATUTS.forEach(s => { color('setFillColor', EXP.st[s]); doc.rect(lx, 57.5, 3, 3, 'F'); const t = T(`${s} : ${a.byS[s]}`); doc.text(t, lx + 4.5, 60.2); lx += doc.getTextWidth(t) + 12; });
  doc.setFontSize(10); doc.text(T(`${a.n} résultats attendus, dont ${a.byS['Réalisé']} réalisés`), bx, 68);

  doc.autoTable({
    startY: 78, margin: {left: M, right: M},
    head: [['Orientation', 'Résultats', 'Réalisés', 'En cours', 'À engager', 'Abandonnés', 'Avancement']],
    body: ctx.byObj.map(o => [T(o.name), o.agg.n, o.agg.byS['Réalisé'], o.agg.byS['En cours'], o.agg.byS['À engager'], o.agg.byS['Abandonné'], T(expPct(o.agg.taux))]),
    styles: {font: 'helvetica', fontSize: 9, cellPadding: 2.2, textColor: expRgb(EXP.ink), lineColor: expRgb(EXP.line), lineWidth: 0.1},
    headStyles: {fillColor: expRgb(EXP.accentSoft), textColor: expRgb(EXP.accent), fontStyle: 'bold'},
    columnStyles: {0: {cellWidth: 118}, 1: {halign: 'center'}, 2: {halign: 'center'}, 3: {halign: 'center'}, 4: {halign: 'center'}, 5: {halign: 'center'}, 6: {cellWidth: 55, fontStyle: 'bold'}},
    didDrawCell: d => {
      if (d.section !== 'body' || d.column.index !== 6) return;
      const t = ctx.byObj[d.row.index].agg.taux || 0, x0 = d.cell.x + 17, w0 = d.cell.width - 20, y0 = d.cell.y + d.cell.height / 2 - 1.2;
      color('setFillColor', EXP.track); doc.roundedRect(x0, y0, w0, 2.4, 1.2, 1.2, 'F');
      if (t > 0){ color('setFillColor', EXP.accent); doc.roundedRect(x0, y0, Math.max(w0 * t / 100, 2.4), 2.4, 1.2, 1.2, 'F'); }
    }
  });

  // Détail
  doc.addPage();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); color('setTextColor', EXP.accent);
  doc.text('Détail des résultats attendus', M, 16);
  const body = [];
  ctx.byObj.forEach(o => {
    body.push([{content: T(`${o.name}  (${o.agg.n} résultats, ${expPct(o.agg.taux)})`), colSpan: 8,
      styles: {fillColor: expRgb(EXP.accentSoft), textColor: expRgb(EXP.accent), fontStyle: 'bold'}}]);
    o.rows.forEach(r => body.push([T(r.resultat), r.priorite || '-', T(r.groupement || '-'), r.statut, T(expPct(r.pct)), T(expT0(r)),
      T(r.links.map(l => l.label).join('\n')), T(expComTxt(r))]));
  });
  doc.autoTable({
    startY: 21, margin: {left: M, right: M, bottom: 14},
    head: [['Résultat attendu', 'Prio.', 'Groupement', 'Statut', 'Avct', 'T0 -> cible', 'Projets / actions liés', 'Dernier commentaire']],
    body,
    styles: {font: 'helvetica', fontSize: 7.5, cellPadding: 1.6, textColor: expRgb(EXP.ink), lineColor: expRgb(EXP.line), lineWidth: 0.1, valign: 'middle'},
    headStyles: {fillColor: expRgb(EXP.accent), textColor: [255, 255, 255], fontStyle: 'bold'},
    columnStyles: {0: {cellWidth: 72}, 1: {cellWidth: 11, halign: 'center', fontStyle: 'bold'}, 2: {cellWidth: 22}, 3: {cellWidth: 19, halign: 'center'},
                   4: {cellWidth: 12, halign: 'right', fontStyle: 'bold'}, 5: {cellWidth: 22}, 6: {cellWidth: 50}, 7: {cellWidth: 'auto'}},
    didParseCell: d => {
      if (d.section !== 'body' || d.row.raw.length === 1) return;
      if (d.column.index === 3 && EXP.st[d.cell.raw]){ d.cell.styles.fillColor = expRgb(EXP.st[d.cell.raw]); d.cell.styles.textColor = expRgb(EXP.stText[d.cell.raw]); }
      if (d.column.index === 1 && EXP.prio[d.cell.raw]) d.cell.styles.textColor = expRgb(EXP.prio[d.cell.raw]);
    }
  });

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++){
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); color('setTextColor', EXP.muted);
    doc.text(T(`${ctx.strat.label} - situation au ${expDate(ctx.date)}`), M, 204);
    doc.text(`${i} / ${n}`, W - M, 204, {align: 'right'});
  }
  return doc;
}

/* ----- Tableur (SheetJS) ----- */
function buildXlsx(ctx, XLSX){
  const a = ctx.agg, wb = XLSX.utils.book_new();
  const syn = [
    ['Stratégie', ctx.strat.label], ['Situation au', expDate(ctx.date)], ['Filtres', ctx.filtres], [],
    ['Taux de réalisation (hors abandonnés)', a.taux === null ? null : a.taux / 100],
    ['Résultats attendus', a.n], ...EXP_STATUTS.map(s => [s, a.byS[s]]), [],
    ['Orientation', 'Résultats', 'Réalisés', 'En cours', 'À engager', 'Abandonnés', 'Avancement moyen'],
    ...ctx.byObj.map(o => [o.name, o.agg.n, o.agg.byS['Réalisé'], o.agg.byS['En cours'], o.agg.byS['À engager'], o.agg.byS['Abandonné'], o.agg.taux === null ? null : o.agg.taux / 100])
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(syn);
  const pctCell = ref => { if (ws1[ref] && typeof ws1[ref].v === 'number') ws1[ref].z = '0%'; };
  pctCell('B5');
  ctx.byObj.forEach((o, i) => pctCell('G' + (13 + i)));
  ws1['!cols'] = [{wch: 60}, {wch: 14}, {wch: 10}, {wch: 10}, {wch: 10}, {wch: 12}, {wch: 17}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Synthèse');

  const head = ['Orientation', 'Sous-objectif', 'Résultat attendu', 'Priorité', 'Facile à atteindre', 'Groupement', 'Statut', 'Avancement',
                'Valeur T0', 'Cible', 'Nb projets/actions', 'Projets/actions liés', 'Dernier commentaire', 'Auteur', 'Date du commentaire', 'Dernière mise à jour'];
  const data = ctx.rows.map(r => { const c = expCom(r); return [r.objectif, r.sousObjectif, r.resultat, r.priorite, r.facile, r.groupement, r.statut, r.pct / 100,
    expNil(r.t0) ? null : r.t0, expNil(r.cible) ? null : r.cible, r.links.length, r.links.map(l => l.label).join(' ; '),
    c ? c.texte : '', c ? c.nom : '', c && c.date ? c.date : null, r.dateMaj || null]; });
  const ws2 = XLSX.utils.aoa_to_sheet([head, ...data], {cellDates: true});
  for (let i = 0; i < data.length; i++){
    const rr = i + 2;
    if (ws2['H' + rr]) ws2['H' + rr].z = '0%';
    ['O', 'P'].forEach(c => { if (ws2[c + rr] && ws2[c + rr].t === 'd') ws2[c + rr].z = 'dd/mm/yyyy'; });
  }
  ws2['!cols'] = [30, 30, 60, 9, 10, 16, 12, 11, 10, 10, 10, 45, 60, 20, 14, 14].map(w => ({wch: w}));
  ws2['!autofilter'] = {ref: `A1:P${data.length + 1}`};
  XLSX.utils.book_append_sheet(wb, ws2, 'Résultats');
  return wb;
}

/* ----- Diaporama LibreOffice Impress (.odp, 28 × 21 cm, Tahoma) ----- */
function buildOdp(ctx, JSZip){
  const x = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const cm = v => (Math.round(v * 1000) / 1000) + 'cm';
  const autos = [], gs = {}, ps = {}, ts = {};
  const g = (fill, stroke) => { const k = (fill || '') + '|' + (stroke || '');
    if (!gs[k]){ gs[k] = 'gr' + Object.keys(gs).length;
      autos.push(`<style:style style:name="${gs[k]}" style:family="graphic"><style:graphic-properties draw:fill="${fill ? 'solid' : 'none'}"${fill ? ` draw:fill-color="${fill}"` : ''} draw:stroke="${stroke ? 'solid' : 'none'}"${stroke ? ` svg:stroke-color="${stroke}" svg:stroke-width="0.03cm"` : ''} draw:shadow="hidden"/></style:style>`); }
    return gs[k]; };
  const tf = va => { if (!ts[va]){ ts[va] = 'tf' + va;
      autos.push(`<style:style style:name="${ts[va]}" style:family="graphic"><style:graphic-properties draw:fill="none" draw:stroke="none" draw:shadow="hidden" draw:textarea-vertical-align="${va}" draw:auto-grow-height="false" draw:auto-grow-width="false" fo:padding-top="0cm" fo:padding-bottom="0cm" fo:padding-left="0cm" fo:padding-right="0cm" fo:wrap-option="wrap"/></style:style>`); }
    return ts[va]; };
  const p = (size, color, bold, align, italic) => { const k = [size, color, bold, align, italic].join('|');
    if (!ps[k]){ ps[k] = 'P' + Object.keys(ps).length;
      autos.push(`<style:style style:name="${ps[k]}" style:family="paragraph"><style:paragraph-properties fo:text-align="${align || 'start'}" fo:margin-top="0cm" fo:margin-bottom="0cm"/><style:text-properties style:font-name="Tahoma" fo:font-family="Tahoma" fo:font-size="${size}pt" fo:color="${color}" fo:font-weight="${bold ? 'bold' : 'normal'}" fo:font-style="${italic ? 'italic' : 'normal'}"/></style:style>`); }
    return ps[k]; };
  const rect = (X, Y, W, H, fill, o = {}) => `<draw:rect draw:style-name="${g(fill, o.stroke)}" svg:x="${cm(X)}" svg:y="${cm(Y)}" svg:width="${cm(Math.max(W, 0.02))}" svg:height="${cm(H)}"${o.r ? ` draw:corner-radius="${cm(o.r)}"` : ''}/>`;
  const txt = (X, Y, W, H, s, o = {}) => `<draw:frame draw:style-name="${tf(o.va || 'top')}" svg:x="${cm(X)}" svg:y="${cm(Y)}" svg:width="${cm(W)}" svg:height="${cm(H)}"><draw:text-box>${
    String(s ?? '').split('\n').map(l => `<text:p text:style-name="${p(o.size || 12, o.color || EXP.ink, o.bold, o.align, o.italic)}">${x(l)}</text:p>`).join('')}</draw:text-box></draw:frame>`;
  const bar = (X, Y, W, H, pct, fill) => rect(X, Y, W, H, EXP.track, {r: H / 2}) + (pct > 0 ? rect(X, Y, Math.max(W * pct / 100, H), H, fill, {r: H / 2}) : '');

  const slides = [];
  const foot = () => txt(1.2, 20.1, 18, 0.5, `${ctx.strat.label} · situation au ${expDate(ctx.date)}`, {size: 8, color: EXP.muted});
  const page = (title, sub, body) => slides.push(rect(0, 0, 0.35, 21, EXP.accent) + txt(1.2, 0.9, 25.6, 1.3, title, {size: title.length > 45 ? 20 : 24, bold: true, color: EXP.accent, va: 'bottom'})
    + (sub ? txt(1.2, 2.2, 25.6, 0.6, sub, {size: 11, color: EXP.muted}) : '') + body + foot());
  const a = ctx.agg;

  // 1. Page de garde
  slides.push(rect(0, 0, 28, 21, EXP.paper) + rect(0, 0, 1, 21, EXP.accent)
    + txt(2.5, 6, 23.5, 2, ctx.strat.label, {size: 36, bold: true, color: EXP.accent, va: 'bottom'})
    + txt(2.5, 8.3, 23.5, 1.2, 'État de réalisation', {size: 24, color: EXP.ink})
    + txt(2.5, 10, 23.5, 0.8, `Situation au ${expDate(ctx.date)}`, {size: 14, color: EXP.muted})
    + txt(2.5, 11, 23.5, 1.5, ctx.filtres === 'Aucun filtre' ? '' : `Périmètre : ${ctx.filtres}`, {size: 11, color: EXP.muted}));

  // 2. Synthèse
  let b = txt(1.2, 3.3, 8.3, 2.6, expPct(a.taux), {size: 60, bold: true, color: EXP.accent, va: 'bottom'})
        + txt(1.2, 6, 8.3, 0.7, 'de réalisation (hors abandonnés)', {size: 12, color: EXP.muted})
        + bar(10, 4.4, 16.8, 0.7, a.taux || 0, EXP.accent);
  let sx = 10;
  EXP_STATUTS.forEach(s => { const w = a.n ? 16.8 * a.byS[s] / a.n : 0; if (w > 0){ b += rect(sx, 5.6, w, 0.45, EXP.st[s]); sx += w; } });
  EXP_STATUTS.forEach((s, i) => { b += rect(10 + i * 4.2, 6.45, 0.35, 0.35, EXP.st[s]) + txt(10.5 + i * 4.2, 6.35, 3.6, 0.6, `${s} : ${a.byS[s]}`, {size: 10}); });
  const kpis = [['Résultats attendus', a.n, EXP.accent], ...EXP_STATUTS.map(s => [s, a.byS[s], s === 'À engager' ? EXP.stText[s] : EXP.st[s]])];
  const kw = (25.6 - 4 * 0.4) / 5;
  kpis.forEach(([l, v, c], i) => { const X = 1.2 + i * (kw + 0.4);
    b += rect(X, 9, kw, 3.2, '#ffffff', {stroke: EXP.line, r: 0.2}) + txt(X, 9.3, kw, 1.6, String(v), {size: 30, bold: true, color: c, align: 'center', va: 'bottom'})
       + txt(X, 11, kw, 0.8, l, {size: 11, color: EXP.muted, align: 'center'}); });
  page('Synthèse', null, b);

  // 3. Avancement par orientation (11 par diapositive)
  for (let i = 0; i < ctx.byObj.length; i += 11){
    let body = '';
    ctx.byObj.slice(i, i + 11).forEach((o, k) => { const Y = 3.3 + k * 1.5;
      body += rect(1.2, Y + 1.38, 25.6, 0.02, EXP.line)
        + txt(1.2, Y, 13.2, 1.3, expTrunc(o.name, 120), {size: 12, va: 'middle'})
        + bar(14.8, Y + 0.45, 8.2, 0.42, o.agg.taux || 0, EXP.accent)
        + txt(23.2, Y, 1.7, 1.3, expPct(o.agg.taux), {size: 12, bold: true, color: EXP.accent, va: 'middle', align: 'end'})
        + txt(25, Y, 1.8, 1.3, `${o.agg.byS['Réalisé']}/${o.agg.n} réal.`, {size: 9, color: EXP.muted, va: 'middle', align: 'end'}); });
    page('Avancement par orientation' + (i ? ' (suite)' : ''), null, body);
  }

  // 4. Une diapositive par orientation (10 résultats par diapositive)
  ctx.byObj.forEach(o => {
    for (let i = 0; i < o.rows.length; i += 10){
      let body = '';
      o.rows.slice(i, i + 10).forEach((r, k) => { const Y = 3.2 + k * 1.62, c = expComTxt(r);
        const sub = [r.groupement, r.links.length ? `${r.links.length} projet${r.links.length > 1 ? 's' : ''}/action${r.links.length > 1 ? 's' : ''}` : '', c ? 'Dernier commentaire : ' + c : ''].filter(Boolean).join(' · ');
        body += rect(1.2, Y, 0.14, 1.42, EXP.st[r.statut])
          + txt(1.55, Y, 15.4, 0.8, expTrunc(r.resultat, 82), {size: 10, va: 'middle'})
          + txt(1.55, Y + 0.8, 15.4, 0.62, expTrunc(sub, 135), {size: 8, color: EXP.muted, italic: !!c, va: 'top'})
          + (r.priorite ? rect(17.3, Y + 0.4, 1.1, 0.6, EXP.prioSoft[r.priorite], {r: 0.1}) + txt(17.3, Y + 0.4, 1.1, 0.6, r.priorite, {size: 9, bold: true, color: EXP.prio[r.priorite], align: 'center', va: 'middle'}) : '')
          + rect(18.6, Y + 0.4, 2.7, 0.6, EXP.st[r.statut], {r: 0.3}) + txt(18.6, Y + 0.4, 2.7, 0.6, r.statut, {size: 9, bold: true, color: EXP.stText[r.statut], align: 'center', va: 'middle'})
          + bar(21.6, Y + 0.57, 3.4, 0.26, r.pct, EXP.st[r.statut] === EXP.st['À engager'] ? EXP.accent : EXP.st[r.statut])
          + txt(25.1, Y + 0.3, 1.7, 0.8, expPct(r.pct), {size: 11, bold: true, align: 'end', va: 'middle'}); });
      page(expTrunc(o.name, 62) + (i ? ' (suite)' : ''), i ? null : `${o.agg.n} résultat${o.agg.n > 1 ? 's' : ''} attendu${o.agg.n > 1 ? 's' : ''} · réalisation ${expPct(o.agg.taux)} · ${o.agg.byS['Réalisé']} réalisé${o.agg.byS['Réalisé'] > 1 ? 's' : ''}`, body);
    }
  });

  // 5. Matrice priorité × facilité (résultats réalisés exclus)
  let m = txt(2.8, 3.2, 11.8, 0.7, 'Facile à atteindre', {size: 13, bold: true, color: EXP.accent, align: 'center', va: 'middle'})
        + txt(15, 3.2, 11.8, 0.7, 'Difficile à atteindre', {size: 13, bold: true, color: EXP.accent, align: 'center', va: 'middle'});
  ['P1', 'P2', 'P3'].forEach((pr, i) => { const Y = 4.1 + i * 5.25;
    m += rect(1.2, Y, 1.4, 5, EXP.prioSoft[pr]) + rect(1.2, Y, 0.12, 5, EXP.prio[pr]) + txt(1.2, Y, 1.4, 5, pr, {size: 20, bold: true, color: EXP.prio[pr], align: 'center', va: 'middle'});
    ['Oui', 'Non'].forEach((f, j) => { const X = j ? 15 : 2.8;
      const all = ctx.rows.filter(r => r.priorite === pr && r.facile === f), items = all.filter(r => r.statut !== 'Réalisé'), nr = all.length - items.length;
      m += rect(X, Y, 11.8, 5, '#ffffff', {stroke: EXP.line, r: 0.15})
        + txt(X + 0.35, Y + 0.25, 11.1, 0.7, EXP_MATRICE[pr + '|' + f], {size: 13, bold: true})
        + txt(X + 0.35, Y + 0.9, 11.1, 0.55, `${items.length} à traiter${nr ? ` · ${nr} réalisé${nr > 1 ? 's' : ''}` : ''}`, {size: 9, color: EXP.muted});
      const shown = items.slice(0, 4);
      shown.forEach((r, k) => { m += rect(X + 0.35, Y + 1.6 + k * 0.62, 0.1, 0.45, EXP.st[r.statut])
        + txt(X + 0.6, Y + 1.55 + k * 0.62, 9.6, 0.55, expTrunc(r.resultat, 50), {size: 9, va: 'middle'})
        + txt(X + 10.2, Y + 1.55 + k * 0.62, 1.3, 0.55, expPct(r.pct), {size: 9, bold: true, align: 'end', va: 'middle'}); });
      if (items.length > shown.length) m += txt(X + 0.6, Y + 4.2, 10.9, 0.45, `+ ${items.length - shown.length} autre${items.length - shown.length > 1 ? 's' : ''}`, {size: 8, color: EXP.muted, italic: true});
    }); });
  page('Matrice priorité × facilité', 'Résultats restant à traiter (réalisés exclus)', m);

  const NS = 'xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:draw="urn:oasis:names:tc:opendocument:xmlns:drawing:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0" xmlns:presentation="urn:oasis:names:tc:opendocument:xmlns:presentation:1.0"';
  const fonts = '<office:font-face-decls><style:font-face style:name="Tahoma" svg:font-family="Tahoma"/></office:font-face-decls>';
  const pages = slides.map((s, i) => `<draw:page draw:name="page${i + 1}" draw:style-name="dp1" draw:master-page-name="Standard">${s}</draw:page>`).join('');
  const content = `<?xml version="1.0" encoding="UTF-8"?><office:document-content ${NS} office:version="1.2">${fonts}<office:automatic-styles><style:style style:name="dp1" style:family="drawing-page"><style:drawing-page-properties presentation:background-visible="true" presentation:background-objects-visible="true"/></style:style>${autos.join('')}</office:automatic-styles><office:body><office:presentation>${pages}</office:presentation></office:body></office:document-content>`;
  const styles = `<?xml version="1.0" encoding="UTF-8"?><office:document-styles ${NS} office:version="1.2">${fonts}<office:styles><style:default-style style:family="graphic"><style:text-properties style:font-name="Tahoma" fo:font-size="12pt"/></style:default-style></office:styles><office:automatic-styles><style:page-layout style:name="PM1"><style:page-layout-properties fo:margin-top="0cm" fo:margin-bottom="0cm" fo:margin-left="0cm" fo:margin-right="0cm" fo:page-width="28cm" fo:page-height="21cm" style:print-orientation="landscape"/></style:page-layout><style:style style:name="Mdp1" style:family="drawing-page"><style:drawing-page-properties draw:fill="solid" draw:fill-color="#ffffff"/></style:style></office:automatic-styles><office:master-styles><style:master-page style:name="Standard" style:page-layout-name="PM1" draw:style-name="Mdp1"/></office:master-styles></office:document-styles>`;
  const manifest = `<?xml version="1.0" encoding="UTF-8"?><manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2"><manifest:file-entry manifest:full-path="/" manifest:version="1.2" manifest:media-type="application/vnd.oasis.opendocument.presentation"/><manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/><manifest:file-entry manifest:full-path="styles.xml" manifest:media-type="text/xml"/></manifest:manifest>`;
  const zip = new JSZip();
  zip.file('mimetype', 'application/vnd.oasis.opendocument.presentation', {compression: 'STORE'});
  zip.file('content.xml', content); zip.file('styles.xml', styles); zip.file('META-INF/manifest.xml', manifest);
  return zip;
}
/* EXPORT-END */


/* ---------- export : chargement des bibliothèques et déclenchement ---------- */
const LIBS = {
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  autotable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
};
const loaded = {};
const loadScript = url => loaded[url] = loaded[url] || new Promise((ok, ko) => {
  const s = document.createElement('script'); s.src = url; s.onload = ok;
  s.onerror = () => { delete loaded[url]; ko(new Error('bibliothèque indisponible (' + url.split('/').slice(-2, -1)[0] + ')')); };
  document.head.appendChild(s);
});
function exportCtx(){
  const rows = filtered(), f = [];
  if (S.prios.size) f.push('priorité ' + [...S.prios].sort().join(', '));
  if (S.grp) f.push('groupement ' + S.grp);
  if (S.obj) f.push('orientation ' + S.obj);
  if (S.fac) f.push('facile à atteindre : ' + S.fac.toLowerCase());
  if (S.st) f.push('statut ' + S.st);
  if (S.txt) f.push('recherche « ' + S.txt + ' »');
  const byObj = [...groupBy(rows, r => r.objectif)].map(([name, rs]) => ({name, rows: rs, agg: aggregate(rs)}));
  return {strat: S.strat, date: new Date(), filtres: f.length ? f.join(' ; ') : 'Aucun filtre', rows, agg: aggregate(rows), byObj};
}
function download(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function runExport(kind){
  const btn = $('#expBtn'), label = btn.textContent;
  const ctx = exportCtx();
  if (!ctx.rows.length){ alert('Aucun résultat attendu à exporter avec les filtres actuels.'); return; }
  btn.disabled = true; btn.textContent = 'Export en cours…';
  try {
    if (kind === 'pdf'){
      await loadScript(LIBS.jspdf); await loadScript(LIBS.autotable);
      const jsPDF = window.jspdf.jsPDF;
      if (!jsPDF.API.autoTable && window.jspdf_autotable && window.jspdf_autotable.applyPlugin) window.jspdf_autotable.applyPlugin(jsPDF);
      download(buildPdf(ctx, jsPDF).output('blob'), expFile(ctx, 'pdf'));
    } else if (kind === 'xlsx'){
      await loadScript(LIBS.xlsx);
      const out = XLSX.write(buildXlsx(ctx, XLSX), {bookType: 'xlsx', type: 'array', cellDates: true});
      download(new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), expFile(ctx, 'xlsx'));
    } else if (kind === 'odp'){
      await loadScript(LIBS.jszip);
      const blob = await buildOdp(ctx, JSZip).generateAsync({type: 'blob', mimeType: 'application/vnd.oasis.opendocument.presentation', compression: 'DEFLATE'});
      download(blob, expFile(ctx, 'odp'));
    }
  } catch(e){ alert("L'export a échoué : " + (e.message || e)); }
  finally { btn.disabled = false; btn.textContent = label; }
}
const expMenu = open => { $('#expMenu').classList.toggle('open', open); $('#expBtn').setAttribute('aria-expanded', open); };
$('#expBtn').addEventListener('click', e => { e.stopPropagation(); expMenu(!$('#expMenu').classList.contains('open')); });
$('#expMenu').addEventListener('click', e => { const b = e.target.closest('[data-exp]'); if (!b) return; expMenu(false); runExport(b.dataset.exp); });
document.addEventListener('click', () => expMenu(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') expMenu(false); });

/* ---------- navigation ---------- */
const confirmLeave = () => !S.dirty || confirm('Des modifications ne sont pas enregistrées. Les abandonner ?');
function setView(v){
  if (S.view === 'saisie' && v !== 'saisie' && !confirmLeave()) return;
  S.view = v; S.dirty = false;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'v-' + v));
  render();
}
function selectRow(id, openEdit){
  if (S.view === 'saisie' && id !== S.selectedId && !confirmLeave()) return;
  S.selectedId = id; S.dirty = false;
  if (S.attached === S.strat.id){ try { grist.setCursorPos({rowId: id}); } catch(e){} }
  if (openEdit && S.view !== 'saisie') setView('saisie'); else render();
}
$('#strat').addEventListener('change', async e => {
  if (!confirmLeave()){ e.target.value = S.strat.id; return; }
  S.strat = S.strategies.find(s => s.id === e.target.value); S.selectedId = null; S.openLinks.clear(); S.dirty = false;
  try { await grist.setOption('strategie', S.strat.id); } catch(err){}
  load();
});
$('#refresh').addEventListener('click', () => { if (confirmLeave()){ S.dirty = false; S.refLabels = {}; S.meta = null; S.refCache = {}; load(); } });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));
document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  const p = ch.dataset.prio; S.prios.has(p) ? S.prios.delete(p) : S.prios.add(p);
  ch.setAttribute('aria-pressed', S.prios.has(p)); render();
}));
$('#fGrp').addEventListener('change', e => { S.grp = e.target.value; render(); });
$('#fObj').addEventListener('change', e => { S.obj = e.target.value; render(); });
$('#fFac').addEventListener('change', e => { S.fac = e.target.value; render(); });
$('#fSt').addEventListener('change', e => { S.st = e.target.value; render(); });
$('#fTxt').addEventListener('input', e => { S.txt = e.target.value; render(); });
$('#reset').addEventListener('click', () => {
  S.prios.clear(); S.grp = S.obj = S.fac = S.st = S.txt = '';
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  $('#fGrp').value = $('#fObj').value = $('#fFac').value = $('#fSt').value = $('#fTxt').value = '';
  render();
});
document.querySelector('main').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed){ selectRow(+ed.dataset.edit, true); return; }
  const se = e.target.closest('[data-select]'); if (se){ selectRow(+se.dataset.select, false); return; }
  const lk = e.target.closest('[data-links]');
  if (lk){ const id = +lk.dataset.links; S.openLinks.has(id) ? S.openLinks.delete(id) : S.openLinks.add(id); render(); }
});

/* ---------- branchement Grist ---------- */
let timer = null;
const reload = () => { clearTimeout(timer); timer = setTimeout(() => { if (!S.dirty) load(); }, 300); };
grist.ready({requiredAccess: 'full'});
(async () => { try { S.attached = await grist.getSelectedTableId(); } catch(e){} load(); })();
grist.onRecords(reload);  // se rafraîchit quand la table à laquelle le widget est rattaché change
grist.onRecord(rec => {
  if (!rec || S.attached !== S.strat?.id || rec.id === S.selectedId || S.dirty) return;
  S.selectedId = rec.id; if (S.view === 'saisie') render();
});
</script>
</body>
